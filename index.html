:root{
  --bg:#1a1446;--cab:#2b2170;--deep:#120d33;--edge:#4a3da8;--edge-d:#0e0a2b;
  --coin:#ffd23f;--coin-d:#9a7400;--hit:#ff5a67;--pass:#4fe3a1;--ice:#e9e6ff;--mut:#a79fe0;--lane:#221a5c;
  --ui:"Chakra Petch",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --px:"Press Start 2P","Chakra Petch",monospace;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ice);font:500 16px/1.5 var(--ui)}
#app{height:100dvh;display:flex;flex-direction:column;max-width:1240px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit;border-radius:0}
:focus-visible{outline:3px solid var(--ice);outline-offset:2px}

/* controls */
.btn{font:700 16px/1.1 var(--ui);color:var(--ice);background:var(--cab);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge-d);padding:0 18px;min-height:52px;cursor:pointer;touch-action:manipulation}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge-d)}
.btn.pri{background:var(--coin);border-color:var(--coin);color:var(--bg);box-shadow:0 4px 0 var(--coin-d)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:active:not(:disabled){transform:none;background:var(--cab)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.field{width:100%;background:var(--deep);border:3px solid var(--edge);padding:0 14px;min-height:52px}
.field::placeholder{color:var(--mut)}
.row .field{box-shadow:0 4px 0 var(--edge-d)}
label{display:block;font-weight:700;color:var(--mut);margin:18px 0 6px}

/* layout */
.wrap{padding:22px 18px calc(28px + env(safe-area-inset-bottom));overflow:auto;flex:1}
.narrow{max-width:460px;margin:0 auto;width:100%}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.row{display:flex;gap:12px;align-items:stretch}.row>*{flex:1;min-width:0}.row>.fix{flex:0 0 auto}
.panel{background:var(--cab);border:3px solid var(--edge);padding:14px 16px}
.small{font-size:14px;color:var(--mut)}
h1,h2,h3,p{margin:0}

/* title */
.logo{font:24px/1.35 var(--px);color:var(--ice);text-shadow:3px 3px 0 var(--hit);margin:6px 0 12px;overflow-wrap:anywhere}
.logo.sm{font-size:16px;text-shadow:2px 2px 0 var(--hit);margin:0 0 16px}
.tag{font-size:18px;color:var(--ice);margin-bottom:20px;max-width:30ch}

/* pixel race track */
.lanes{display:flex;flex-direction:column;gap:14px}
.lane-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-height:26px}
.lane-top .nm{flex:1;min-width:0}
.track{position:relative;height:46px;background:var(--lane);border:3px solid var(--edge);overflow:hidden}
.rn{position:absolute;left:0;bottom:5px;line-height:0;transition:left .6s steps(8)}
.flag{position:absolute;right:0;top:0;line-height:0}
.demo{display:flex;flex-direction:column;gap:10px;margin:4px 0 6px}
.demo .rn.a{animation:dash 2.2s steps(22) .4s forwards}
.demo .rn.b{animation:dash 2.7s steps(27) .4s forwards}
@keyframes dash{to{left:calc(100% - 50px)}}

/* players */
.pl{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:3px solid var(--bg)}
.pl:first-of-type{border-top:0}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font:700 12px/1 var(--ui);padding:5px 8px;background:var(--deep);border:2px solid var(--edge);color:var(--mut);white-space:nowrap}
.chip.acc{background:var(--coin);border-color:var(--coin);color:var(--bg)}
.codebox{font:32px/1 var(--px);letter-spacing:.2em;text-indent:.2em;text-align:center;color:var(--coin);background:var(--deep);border:3px solid var(--edge);padding:20px 8px;margin:10px 0 14px;cursor:pointer;user-select:all}

/* arena */
.hdr{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--cab);border-bottom:3px solid var(--edge)}
.hdr h2{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .btn{min-height:44px;min-width:44px;padding:0 10px;box-shadow:none}
#timer{font:16px/1 var(--px);min-width:80px;text-align:right}
#timer.low{color:var(--hit);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.tabs{display:flex;background:var(--cab);border-bottom:3px solid var(--edge)}
.tabs button{flex:1;border:0;border-bottom:4px solid transparent;background:transparent;color:var(--mut);font:700 16px var(--ui);min-height:48px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ice);border-bottom-color:var(--coin)}
.arena{flex:1;min-height:0;display:flex;flex-direction:column}
.panes{flex:1;min-height:0;display:flex}
.pane{display:none;flex:1;min-width:0;min-height:0;flex-direction:column;overflow:auto;padding:16px}
.pane.on{display:flex}
.pane.codepane{padding:0}
.pane h3{font-size:20px;line-height:1.2}
.dm{display:inline-flex;gap:3px;align-items:center;flex:0 0 auto}
.dm i{width:10px;height:10px;background:var(--deep);border:2px solid var(--edge)}
.dm i.on{background:var(--coin);border-color:var(--coin)}
pre{margin:6px 0 14px;background:var(--deep);border:3px solid var(--edge);padding:10px 12px;font:14px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;overflow:auto}
.keys{display:flex;gap:8px;padding:8px;overflow-x:auto;background:var(--cab);border-bottom:3px solid var(--edge)}
.keys .btn{min-height:42px;min-width:44px;padding:0 10px;font:700 16px var(--mono);flex:0 0 auto;box-shadow:0 3px 0 var(--edge-d)}
textarea#ed{flex:1;min-height:150px;width:100%;resize:none;border:0;background:var(--deep);color:var(--ice);font:14px/1.6 var(--mono);padding:12px;tab-size:4;white-space:pre;overflow:auto}
.con{border-top:3px solid var(--edge);background:var(--cab);padding:10px 12px;max-height:36%;overflow:auto;min-height:64px}
.con .t{font-weight:700;color:var(--mut);margin-bottom:4px}
.tests{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.tc{font:700 13px var(--mono);padding:4px 9px;border:2px solid var(--edge);background:var(--deep)}
.tc.ok{color:var(--pass);border-color:var(--pass)}.tc.no{color:var(--hit);border-color:var(--hit)}
.ok-t{color:var(--pass);font-weight:700}.no-t{color:var(--hit);font-weight:700}
.bar{display:flex;gap:12px;padding:12px 12px calc(14px + env(safe-area-inset-bottom));background:var(--cab);border-top:3px solid var(--edge)}
.bar .btn{flex:1}

/* results */
.crown{margin:6px 0 12px;line-height:0}
.win{font:20px/1.4 var(--px);overflow-wrap:anywhere;margin-bottom:6px}
.score{font:48px/1 var(--px);color:var(--coin);margin:10px 0 6px}
.score small{font:700 18px var(--ui);color:var(--mut);margin-left:10px}
.rb{width:28px;height:28px;display:grid;place-items:center;font:700 15px var(--ui);background:var(--deep);border:2px solid var(--edge);color:var(--mut);flex:0 0 auto}
.rb.r1{background:var(--coin);border-color:var(--coin);color:var(--bg)}
.rb.r2{background:var(--ice);border-color:var(--ice);color:var(--bg)}
.rb.r3{background:#ff9b3d;border-color:#ff9b3d;color:var(--bg)}
.rise{animation:rise .5s steps(5) both}
@keyframes rise{from{transform:translateY(12px);opacity:0}}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ice);color:var(--bg);border:3px solid var(--bg);box-shadow:0 4px 0 var(--edge-d);font-weight:700;padding:10px 16px;z-index:9;max-width:90vw;opacity:0;pointer-events:none}
#toast.on{opacity:1}

@media(min-width:900px){
  .tabs{display:none}
  .pane{display:flex!important;border-right:3px solid var(--edge)}
  .pane:last-child{border-right:0}
  .pane.codepane{flex:1.7}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .demo .rn{left:calc(100% - 50px)}
}
</style>
</head>

<script>
(function(){
'use strict';
var APP_VER='1';
var PROBLEMS=[{"id":"sum2","title":"Add Two Numbers","diff":1,"statement":"Read two integers a and b. Print their sum.","sample":{"in":"3 4","out":"7"},"tests":[{"in":"3 4","out":"7"},{"in":"-5 5","out":"0"},{"in":"100 250","out":"350"},{"in":"-20 -30","out":"-50"},{"in":"0 0","out":"0"}]},{"id":"maxn","title":"Largest of N","diff":2,"statement":"First line: N. Second line: N integers. Print the largest.","sample":{"in":"5\n3 9 2 7 1","out":"9"},"tests":[{"in":"5\n3 9 2 7 1","out":"9"},{"in":"1\n-4","out":"-4"},{"in":"4\n-1 -9 -3 -2","out":"-1"},{"in":"6\n10 10 10 10 10 11","out":"11"},{"in":"3\n0 0 0","out":"0"}]},{"id":"fact","title":"Factorial","diff":2,"statement":"Read N (0 <= N <= 10). Print N!.","sample":{"in":"5","out":"120"},"tests":[{"in":"5","out":"120"},{"in":"0","out":"1"},{"in":"1","out":"1"},{"in":"10","out":"3628800"},{"in":"7","out":"5040"}]},{"id":"prime","title":"Prime or Not","diff":3,"statement":"Read N (N >= 1). Print YES if N is prime, otherwise NO.","sample":{"in":"7","out":"YES"},"tests":[{"in":"7","out":"YES"},{"in":"1","out":"NO"},{"in":"2","out":"YES"},{"in":"15","out":"NO"},{"in":"97","out":"YES"},{"in":"100","out":"NO"},{"in":"7919","out":"YES"}]},{"id":"rev","title":"Reverse the Number","diff":3,"statement":"Read a non-negative integer N. Print its digits reversed (drop leading zeros of the result; 0 stays 0).","sample":{"in":"1200","out":"21"},"tests":[{"in":"1200","out":"21"},{"in":"12345","out":"54321"},{"in":"0","out":"0"},{"in":"7","out":"7"},{"in":"1000000","out":"1"},{"in":"908","out":"809"}]},{"id":"gcd","title":"GCD","diff":3,"statement":"Read two positive integers. Print their greatest common divisor.","sample":{"in":"12 18","out":"6"},"tests":[{"in":"12 18","out":"6"},{"in":"7 13","out":"1"},{"in":"100 75","out":"25"},{"in":"9 9","out":"9"},{"in":"1000000 250000","out":"250000"}]},{"id":"fib","title":"Fibonacci","diff":4,"statement":"Read N (1 <= N <= 40). Print the Nth Fibonacci number, where F1 = 1 and F2 = 1.","sample":{"in":"6","out":"8"},"tests":[{"in":"6","out":"8"},{"in":"1","out":"1"},{"in":"2","out":"1"},{"in":"10","out":"55"},{"in":"30","out":"832040"},{"in":"40","out":"102334155"}]},{"id":"pal","title":"Palindrome Check","diff":4,"statement":"Read one word (lowercase letters, no spaces). Print YES if it reads the same backwards, otherwise NO.","sample":{"in":"level","out":"YES"},"tests":[{"in":"level","out":"YES"},{"in":"hello","out":"NO"},{"in":"a","out":"YES"},{"in":"abba","out":"YES"},{"in":"abca","out":"NO"},{"in":"racecar","out":"YES"}]},{"id":"vow","title":"Count Vowels","diff":4,"statement":"Read one word (lowercase letters). Print how many vowels (a, e, i, o, u) it contains.","sample":{"in":"education","out":"5"},"tests":[{"in":"education","out":"5"},{"in":"rhythm","out":"0"},{"in":"aeiou","out":"5"},{"in":"programming","out":"3"},{"in":"b","out":"0"}]}];
var MAX_PLAYERS=8;
var CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var STARTER='#include <stdio.h>\n\nint main() {\n    \n    return 0;\n}\n';

var SVGNS='http://www.w3.org/2000/svg';
var DIFF=['','Warm-up','Easy','Medium','Hard'];

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function h(tag,props){
  var e=document.createElement(tag);
  if(props)for(var k in props){var v=props[k];
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);

  for(var i=2;i<arguments.length;i++)add(e,arguments[i]);

function svg(tag,attrs){var e=document.createElementNS(SVGNS,tag);for(var k in attrs)e.setAttribute(k,String(attrs[k]));return e;}
function sprite(grid,color,scale){
  var cols=grid[0].length,rows=grid.length;
  var s=svg('svg',{viewBox:'0 0 '+cols+' '+rows,width:cols*scale,height:rows*scale,'shape-rendering':'crispEdges','aria-hidden':'true',focusable:'false'});
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    var ch=grid[r].charAt(c);if(ch==='.')continue;
    s.appendChild(svg('rect',{x:c,y:r,width:1,height:1,fill:ch==='X'?color:ch==='V'?'#1a1446':'#e9e6ff'}));
  }
  return s;
}
function flagEl(){
  var s=svg('svg',{viewBox:'0 0 2 4',width:20,height:40,'shape-rendering':'crispEdges','aria-hidden':'true',focusable:'false'});
  for(var r=0;r<4;r++)for(var c=0;c<2;c++)s.appendChild(svg('rect',{x:c,y:r,width:1,height:1,fill:(r+c)%2?'#120d33':'#e9e6ff'}));
  var w=h('span',{class:'flag'});w.appendChild(s);return w;
}
function runnerEl(color,cls){var w=h('span',{class:'rn'+(cls?' '+cls:'')});w.appendChild(sprite(HERO,color,3));return w;}
function trackEl(color,frac,label,cls){
  var t=h('div',{class:'track',role:'img','aria-label':label});
  var r=runnerEl(color,cls);r.style.left='calc((100% - 50px) * '+frac+')';
  t.appendChild(r);t.appendChild(flagEl());return t;
}
var store={
  get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}
};
function clampInt(v,lo,hi){v=Math.floor(Number(v));if(!isFinite(v))return lo;return Math.max(lo,Math.min(hi,v));}
function cleanName(v){
  var s=String(v==null?'':v).replace(/[^\p{L}\p{N} _.\-]/gu,'').replace(/\s+/g,' ').trim().slice(0,16);
  return s||'Player';
}
function fmt(ms){ms=Math.max(0,ms);var s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function fmtT(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
var toastT;

function problemById(id){for(var i=0;i<PROBLEMS.length;i++)if(PROBLEMS[i].id===id)return PROBLEMS[i];return PROBLEMS[0];}
function scoreOf(passed,total){if(!total||passed<=0)return 1;return Math.max(1,Math.min(10,Math.round(1+9*passed/total)));}
function rank(list){
  return list.slice().sort(function(a,b){
    return (b.passed-a.passed)||(a.passed?(a.lastT-b.lastT):0)||a.name.localeCompare(b.name);
  });
}
function ordinal(n){return n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th';}
function colorOf(id){for(var i=0;i<S.players.length;i++)if(S.players[i].id===id)return PCOL[i%PCOL.length];return PCOL[0];}
function diffMeter(n){
  var m=h('span',{class:'dm',role:'img','aria-label':DIFF[n]+' difficulty'});
  for(var i=1;i<=4;i++)m.appendChild(h('i',{class:i<=n?'on':''}));
  return m;
}

/* ---------- state ---------- */
var S={
  screen:'home',view:null,role:null,name:store.get('cduel_name')||'',code:'',
  peer:null,myId:null,conns:{},hostConn:null,
  players:[],phase:'lobby',pid:PROBLEMS[0].id,rand:false,dur:600,endAt:0,startAt:0,
  winnerId:null,reason:'',
  mySubs:0,busy:false,lastRes:null,tab:'problem',tick:null,lastProg:{}
};
var root=$('#app');
function isHost(){return S.role==='host'||S.role==='solo';}
function myPlayer(){for(var i=0;i<S.players.length;i++)if(S.players[i].id===S.myId)return S.players[i];return null;}
function curProblem(){return problemById(S.pid);}

/* ---------- C engine ---------- */
function normC(c){
  return String(c)
    .replace(/#include\s*<(stdio|stdlib|string|math|ctype|limits|time)\.h>/g,'#include <c$1>')
    .replace(/%l?l[du]/g,'%d').replace(/%lf/g,'%f')

  var out='';
  try{
    window.JSCPP.run(normC(code),input,{stdio:{write:function(s){if(out.length<20000)out+=s;}},maxTimeout:1500});
    return {ok:true,out:out};
  }catch(e){
    var msg=String(e&&e.message?e.message:e);
    return {ok:false,tle:/time limit/i.test(msg),err:msg.slice(0,300),out:out};
  }
}

  return n(a)===n(b);
}
function tick0(){return new Promise(function(r){setTimeout(r,0);});}

  return {t:'state',phase:S.phase,pid:S.pid,rand:S.rand,dur:S.dur,left:Math.max(0,S.endAt-Date.now()),
    winner:S.winnerId,reason:S.reason,
    players:S.players.map(function(p){return {id:p.id,name:p.name,passed:p.passed,total:p.total,subs:p.subs,lastT:p.lastT,online:p.online};})};
}
function pushState(){if(S.role==='host')bcast(stateMsg());render();}

  if(!m||typeof m!=='object'||m.t!=='state')return null;
  if(['lobby','live','over'].indexOf(m.phase)<0)return null;
  if(typeof m.pid!=='string'||!PROBLEMS.some(function(p){return p.id===m.pid;}))return null;
  if(!Array.isArray(m.players)||m.players.length>MAX_PLAYERS+2)return null;
  var pl=m.players.map(function(p){
    if(!p||typeof p.id!=='string')return null;
    return {id:p.id.slice(0,80),name:cleanName(p.name),passed:clampInt(p.passed,0,50),total:clampInt(p.total,0,50),
      subs:clampInt(p.subs,0,999),lastT:clampInt(p.lastT,0,7200000),online:!!p.online};
  });
  if(pl.indexOf(null)>=0)return null;
  return {phase:m.phase,pid:m.pid,rand:!!m.rand,dur:clampInt(m.dur,60,3600),left:clampInt(m.left,0,3600000),
    winner:(typeof m.winner==='string')?m.winner.slice(0,80):null,
    reason:(m.reason==='solved'||m.reason==='time')?m.reason:'',players:pl};
}
function applyState(v){
  var prev=S.phase;
  S.phase=v.phase;S.pid=v.pid;S.rand=v.rand;S.dur=v.dur;S.endAt=Date.now()+v.left;
  S.players=v.players;S.winnerId=v.winner;S.reason=v.reason;
  if(v.phase==='live'&&prev!=='live')beginLocalMatch();
  render();
}
function randCode(){var s='';for(var i=0;i<4;i++)s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return s;}
function resetNet(){
  clearInterval(S.tick);S.tick=null;
  try{if(S.peer)S.peer.destroy();}catch(e){}
  S.peer=null;S.conns={};S.hostConn=null;S.role=null;S.code='';S.myId=null;
  S.players=[];S.phase='lobby';S.winnerId=null;S.reason='';S.lastProg={};
}
function goHome(msg){resetNet();S.screen='home';S.view=null;render();if(msg)toast(msg);}
function makeMe(id){return {id:id,name:S.name,passed:0,total:0,subs:0,lastT:0,online:true};}

function startSolo(){
  resetNet();S.role='solo';S.myId='solo';S.players=[makeMe('solo')];S.screen='room';S.phase='lobby';S.view=null;render();
}
function createRoom(tries){
  tries=tries||0;
  if(tries===0){resetNet();S.role='host';S.screen='home';}
  var code=randCode(),peer;
  try{peer=new window.Peer('cduel-'+code);}catch(e){toast('Network unavailable');return;}
  S.peer=peer;
  var opened=false;
  peer.on('open',function(id){
    opened=true;S.myId=id;S.code=code;S.players=[makeMe(id)];S.screen='room';S.phase='lobby';S.view=null;render();
  });
  peer.on('connection',function(conn){
    conn.on('data',function(d){onHostData(conn,d);});
    conn.on('close',function(){onHostLeave(conn);});
    conn.on('error',function(){onHostLeave(conn);});
  });
  peer.on('error',function(e){
    if(e&&e.type==='unavailable-id'&&tries<5&&!opened){try{peer.destroy();}catch(x){}createRoom(tries+1);return;}
    if(!opened){goHome('Could not create the room. Check your connection.');}
    else toast('Network problem: '+(e&&e.type?e.type:'error'));
  });
}
function onHostData(conn,d){
  if(!d||typeof d!=='object')return;
  if(d.t==='join'){
    if(S.conns[conn.peer])return;
    var reject=function(why){try{conn.send({t:'reject',why:why});}catch(e){}setTimeout(function(){try{conn.close();}catch(e){}},300);};
    if(d.ver!==APP_VER)return reject('Version mismatch. Reload the page.');
    if(S.phase!=='lobby')return reject('Match already in progress.');
    if(S.players.length>=MAX_PLAYERS)return reject('Room is full.');
    var nm=cleanName(d.name),base=nm,n=2;
    while(S.players.some(function(p){return p.name===nm;})){nm=(base+' '+n).slice(0,18);n++;}
    S.conns[conn.peer]=conn;
    S.players.push({id:conn.peer,name:nm,passed:0,total:0,subs:0,lastT:0,online:true});
    pushState();
  }else if(d.t==='prog'){
    if(!S.conns[conn.peer])return;
    var now=Date.now();
    if(S.lastProg[conn.peer]&&now-S.lastProg[conn.peer]<300)return;
    S.lastProg[conn.peer]=now;
    onProg(conn.peer,d);
  }
}
function onHostLeave(conn){
  var id=conn.peer;
  if(!S.conns[id])return;
  delete S.conns[id];
  if(S.phase==='lobby')S.players=S.players.filter(function(p){return p.id!==id;});
  else S.players.forEach(function(p){if(p.id===id)p.online=false;});
  pushState();
}
function joinRoom(raw){
  var code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==4){toast('Room codes have 4 characters');return;}
  if(!S.name){toast('Enter your name first');return;}
  resetNet();S.role='guest';S.code=code;
  var peer;
  try{peer=new window.Peer();}catch(e){toast('Network unavailable');return;}
  S.peer=peer;
  var joined=false;
  var timer=setTimeout(function(){if(!joined)goHome('Could not reach that room.');},12000);
  peer.on('open',function(id){
    S.myId=id;
    var c=peer.connect('cduel-'+code,{reliable:true});
    S.hostConn=c;
    c.on('open',function(){c.send({t:'join',name:S.name,ver:APP_VER});});
    c.on('data',function(d){
      if(!d||typeof d!=='object')return;
      if(d.t==='reject'){clearTimeout(timer);goHome(String(d.why||'Could not join').slice(0,80));return;}
      var v=validState(d);
      if(!v)return;
      if(!joined){joined=true;clearTimeout(timer);S.screen='room';S.view=null;}
      applyState(v);
    });
    c.on('close',function(){if(S.role==='guest'){clearTimeout(timer);goHome('The host left the room.');}});
    c.on('error',function(){});
  });
  peer.on('error',function(e){
    clearTimeout(timer);
    if(e&&e.type==='peer-unavailable')goHome('Room not found. Check the code.');
    else if(!joined)goHome('Connection failed. Try again.');
  });
}

/* ---------- match logic ---------- */
function beginLocalMatch(){
  S.startAt=Date.now();S.mySubs=0;S.lastRes=null;S.busy=false;S.tab='problem';
  clearInterval(S.tick);S.tick=setInterval(onTick,250);
}
function startMatch(){
  if(!isHost()||S.phase!=='lobby')return;
  if(S.rand)S.pid=PROBLEMS[Math.floor(Math.random()*PROBLEMS.length)].id;
  var total=curProblem().tests.length;
  S.players.forEach(function(p){p.passed=0;p.total=total;p.subs=0;p.lastT=0;});
  S.phase='live';S.winnerId=null;S.reason='';S.endAt=Date.now()+S.dur*1000;
  beginLocalMatch();pushState();
}
function onProg(id,m){
  if(S.phase!=='live')return;
  var p=null;for(var i=0;i<S.players.length;i++)if(S.players[i].id===id)p=S.players[i];
  if(!p)return;
  var total=curProblem().tests.length;
  var passed=clampInt(m.passed,0,total),subs=clampInt(m.subs,0,999),tms=clampInt(m.tms,0,S.dur*1000+5000);
  p.total=total;p.subs=Math.max(p.subs,subs);
  if(passed>p.passed){p.passed=passed;p.lastT=tms;}
  if(passed===total){finish(p.id,'solved');}else pushState();
}
function finish(winnerId,reason){
  if(S.phase!=='live')return;
  S.phase='over';S.winnerId=winnerId;S.reason=reason;
  clearInterval(S.tick);S.tick=null;
  pushState();
}
function onTick(){
  var t=$('#timer');
  var left=S.endAt-Date.now();
  if(t){t.textContent=fmt(left);t.classList.toggle('low',left<30000&&left>0);}
  if(isHost()&&S.phase==='live'&&left<=0){
    var top=rank(S.players)[0];
    finish(top&&top.passed>0?top.id:null,'time');
  }
}
function submitProgress(passed){
  var m={t:'prog',passed:passed,subs:S.mySubs,tms:Date.now()-S.startAt};
  if(isHost())onProg(S.myId,m);
  else if(S.hostConn&&S.hostConn.open){try{S.hostConn.send(m);}catch(e){}}
}
async function judge(all){
  if(S.busy||S.phase!=='live')return;
  var code=$('#ed').value,p=curProblem();
  if(code.trim().length<10){toast('Write some code first');return;}
  S.busy=true;setBusy(true);
  var list=all?p.tests:[p.sample];
  var res=[],passed=0,err=null,got=null,stop=false;
  for(var i=0;i<list.length;i++){
    await tick0();
    if(S.phase!=='live')break;
    if(stop){res.push({ok:false,skip:true});continue;}
    var r=runC(code,list[i].in);
    if(!r.ok){res.push({ok:false});err=r.tle?'Time limit exceeded (1.5 seconds per test).':r.err;if(r.tle||/error|unexpected|undeclared|syntax/i.test(r.err))stop=true;}
    else if(same(r.out,list[i].out)){res.push({ok:true});passed++;}
    else{res.push({ok:false});if(got===null)got=r.out.slice(0,200);}
  }
  S.busy=false;setBusy(false);
  if(S.phase!=='live')return;
  S.lastRes={all:all,res:res,passed:passed,total:list.length,err:err,got:got,exp:list[0].out,inp:list[0].in};
  if(all){S.mySubs++;submitProgress(passed);}
  paintConsole();
}

/* ---------- views ---------- */
var views={};
function copyText(t,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast(msg);},function(){toast('Could not copy');});}
  else toast('Copy is not available here');
}
function demoRace(){
  return h('div',{class:'demo','aria-hidden':'true'},
    trackEl(PCOL[0],0,'','a'),trackEl(PCOL[1],0,'','b'));
}
views.home=function(){
  var nameIn=h('input',{class:'field',id:'name',maxlength:'16',autocomplete:'nickname',placeholder:'Type your name',value:S.name});
  var codeIn=h('input',{class:'field',id:'jc',maxlength:'4',autocapitalize:'characters',autocomplete:'off',spellcheck:'false',placeholder:'Code',style:'text-transform:uppercase;text-align:center;font-weight:700;letter-spacing:.2em','aria-label':'Room code'});

  return h('div',{class:'wrap'},h('div',{class:'narrow'},

      h('button',{class:'btn ghost',onclick:function(){if(needName())startSolo();}},'Practice solo')),
    h('p',{class:'small',style:'margin-top:22px'},'Your code runs in your own browser. The room only sees your test scores, never your code.')));
};
views.lobby=function(){
  var host=isHost();
  var selP=h('select',{class:'field',id:'selp',disabled:!host},
    h('option',{value:'rand'},'Random problem'),
    PROBLEMS.map(function(p){return h('option',{value:p.id},p.title+' ('+DIFF[p.diff]+')');}));
  selP.value=S.rand?'rand':S.pid;
  selP.addEventListener('change',function(){if(selP.value==='rand'){S.rand=true;}else{S.rand=false;S.pid=selP.value;}pushState();});
  var selT=h('select',{class:'field',id:'selt',disabled:!host},
    [5,10,15,20].map(function(m){return h('option',{value:String(m*60)},m+' minutes');}));

  selT.addEventListener('change',function(){S.dur=clampInt(selT.value,60,3600);pushState();});
  var url=location.origin+location.pathname+'?room='+S.code;
  var roomCard=S.role==='solo'?null:h('div',null,
    h('div',{class:'small'},'Room code. Friends type this to join.'),
    h('div',{class:'codebox',onclick:function(){copyText(S.code,'Code copied');}},S.code),
    h('div',{class:'row'},
      h('button',{class:'btn',onclick:function(){copyText(S.code,'Code copied');}},'Copy code'),
      h('button',{class:'btn',onclick:function(){
        if(navigator.share){navigator.share({title:'C-Slayer Duel',text:'Join my C duel. Room code '+S.code,url:url}).catch(function(){});}
        else copyText(url,'Link copied');
      }},'Share link')));
  var plist=h('div',{class:'panel',style:'margin-top:20px'},
    h('div',{class:'small',style:'margin-bottom:4px'},S.role==='solo'?'Practice mode, just you':('Players '+S.players.length+' of '+MAX_PLAYERS)),
    S.players.map(function(p,i){return h('div',{class:'pl'},
      sprite(HERO,PCOL[i%PCOL.length],3),
      h('span',{class:'nm',style:'flex:1'},p.name),
      i===0&&S.role!=='solo'?h('span',{class:'chip acc'},'Host'):null,
      p.id===S.myId?h('span',{class:'chip'},'You'):null);}));
  var info=host?h('div',null,
      h('label',{for:'selp'},'Problem'),selP,
      h('label',{for:'selt'},'Time limit'),selT,
      h('div',{class:'stack'},h('button',{class:'btn pri',onclick:startMatch},S.players.length>1?'Start duel':'Start practice')))
    :h('div',{class:'panel',style:'margin-top:20px'},
      h('div',{class:'small'},'Problem'),h('div',{style:'font-weight:700'},S.rand?'Random, revealed at the start':curProblem().title),
      h('div',{class:'small',style:'margin-top:10px'},'Time limit'),h('div',{style:'font-weight:700'},Math.round(S.dur/60)+' minutes'),
      h('p',{class:'small',style:'margin-top:14px'},'Waiting for the host to start the duel.'));
  return h('div',{class:'wrap'},h('div',{class:'narrow'},
    h('h1',{class:'logo sm'},'C-Slayer Duel'),
    roomCard,plist,info,
    h('div',{class:'stack'},h('button',{class:'btn ghost',onclick:function(){goHome();}},'Leave room'))));
};
function insertAt(ta,text,back){
  var s=ta.selectionStart,e=ta.selectionEnd;
  ta.setRangeText(text,s,e,'end');
  if(back){var p=ta.selectionStart-back;ta.setSelectionRange(p,p);}
  ta.dispatchEvent(new Event('input',{bubbles:true}));
}
views.arena=function(){
  var p=curProblem();
  var ed=h('textarea',{id:'ed',spellcheck:'false',autocapitalize:'off',autocomplete:'off',autocorrect:'off','aria-label':'C code editor',wrap:'off'});
  var draftKey='cduel_draft_'+p.id;
  ed.value=store.get(draftKey)||STARTER;
  ed.addEventListener('input',function(){store.set(draftKey,ed.value);});
  ed.addEventListener('keydown',function(ev){if(ev.key==='Tab'){ev.preventDefault();insertAt(ed,'    ');}});
  ed.addEventListener('beforeinput',function(ev){
    if(ev.inputType==='insertLineBreak'||(ev.inputType==='insertText'&&ev.data==='\n')){
      ev.preventDefault();
      var v=ed.value,s=ed.selectionStart,ls=v.lastIndexOf('\n',s-1)+1;
      var line=v.slice(ls,s),ind=(line.match(/^[ \t]*/)||[''])[0];
      if(/\{\s*$/.test(line))ind+='    ';
      insertAt(ed,'\n'+ind);
    }
  });
  var keyList=['{','}','(',')','[',']',';','"',"'",'&','*','#','<','>','%','=','\\','Tab'];
  var keys=h('div',{class:'keys',role:'toolbar','aria-label':'Symbol keys'},keyList.map(function(k){
    var txt=k==='Tab'?'    ':k;
    var fn=function(ev){ev.preventDefault();ed.focus();insertAt(ed,txt);};
    return h('button',{type:'button',class:'btn','aria-label':k==='Tab'?'Insert indent':'Insert '+k,
      onpointerdown:fn,onclick:function(ev){if(ev.detail===0)fn(ev);}},k==='Tab'?'Tab':k);
  }));
  var con=h('div',{class:'con',id:'con','aria-live':'polite'},h('div',{class:'t'},'Console'),h('div',{class:'small'},'Run sample checks the sample. Submit runs all '+p.tests.length+' tests and moves your runner.'));
  var tabs=h('div',{class:'tabs',role:'tablist'},['problem','code','board'].map(function(t){
    return h('button',{role:'tab','data-tab':t,'aria-selected':String(S.tab===t),onclick:function(){setTab(t);}},t==='problem'?'Problem':t==='code'?'Code':'Race');
  }));
  var panes=h('div',{class:'panes'},
    h('div',{class:'pane','data-pane':'problem'},
      h('div',{class:'row',style:'align-items:center;flex:0 0 auto;margin-bottom:10px'},h('h3',{style:'flex:1'},p.title),diffMeter(p.diff)),
      h('p',{style:'max-width:60ch;margin-bottom:14px'},p.statement),
      h('div',{class:'small'},'Sample input'),h('pre',null,p.sample.in),
      h('div',{class:'small'},'Sample output'),h('pre',null,p.sample.out),
      h('p',{class:'small',style:'max-width:60ch'},p.tests.length+' tests decide your score and their inputs are hidden. Read with scanf and print with printf. Trailing spaces are ignored.')),
    h('div',{class:'pane codepane','data-pane':'code'},keys,ed,con),
    h('div',{class:'pane','data-pane':'board'},h('div',{class:'lanes',id:'board'})));
  var bar=h('div',{class:'bar'},
    h('button',{class:'btn',id:'runb',onclick:function(){judge(false);}},'Run sample'),
    h('button',{class:'btn pri',id:'subb',onclick:function(){judge(true);}},'Submit'));
  var hdr=h('div',{class:'hdr'},
    h('button',{class:'btn ghost',onclick:function(){if(confirm('Leave this match?'))goHome();},'aria-label':'Leave match'},'X'),
    h('h2',null,p.title),h('div',{id:'timer'},fmt(S.endAt-Date.now())));
  return h('div',{class:'arena'},hdr,tabs,panes,bar);
};
function afterArenaBuild(){setTab(S.tab);buildBoard();onTick();}
function setTab(t){
  S.tab=t;
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',String(b.getAttribute('data-tab')===t));});
  document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.getAttribute('data-pane')===t);});
}
function setBusy(b){
  var r=$('#runb'),s=$('#subb');
  if(r){r.disabled=b;}
  if(s){s.disabled=b;s.textContent=b?'Running...':'Submit';}
}
function paintConsole(){
  var con=$('#con');if(!con)return;
  var r=S.lastRes;con.replaceChildren(h('div',{class:'t'},'Console'));
  if(!r)return;
  if(r.all){
    con.appendChild(h('div',{class:'tests'},r.res.map(function(x,i){return h('span',{class:'tc '+(x.ok?'ok':'no')},'Test '+(i+1)+(x.ok?' passed':' failed'));})));
    con.appendChild(h('div',{class:r.passed===r.total?'ok-t':''},r.passed+' of '+r.total+' tests passed'));
  }else{
    con.appendChild(h('div',{class:r.passed?'ok-t':'no-t'},r.passed?'Sample passed':'Sample failed'));
  }
  if(r.err)con.appendChild(h('pre',null,r.err));
  if(!r.all&&!r.passed&&!r.err&&r.got!==null){
    con.appendChild(h('div',{class:'small'},'Expected'));con.appendChild(h('pre',null,r.exp));
    con.appendChild(h('div',{class:'small'},'Your output'));con.appendChild(h('pre',null,r.got||'(nothing printed)'));
  }
  if(r.all&&r.passed<r.total&&!r.err)con.appendChild(h('div',{class:'small'},'Some hidden tests failed. Check edge cases such as 0, 1, negatives and large values.'));
}
function laneKey(){return S.players.map(function(p){return p.id;}).join('|');}
function laneEl(p,i){
  var col=PCOL[i%PCOL.length];
  var lane=h('div',{class:'lane'},
    h('div',{class:'lane-top'},
      h('span',{class:'nm'},p.name),
      h('span',{class:'chip lc-you'}),
      h('span',{class:'small lc-t'}),
      h('span',{class:'chip lc-rk'})),
    h('div',{class:'track',role:'img'},runnerEl(col),flagEl()));
  return lane;
}
function buildBoard(){
  var b=$('#board');if(!b)return;
  b.setAttribute('data-key',laneKey());
  b.replaceChildren.apply(b,S.players.map(laneEl));
  paintBoard();
}
function paintBoard(){
  var b=$('#board');if(!b)return;
  var total=curProblem().tests.length;
  var ranked=rank(S.players);
  S.players.forEach(function(p,i){
    var lane=b.children[i];if(!lane)return;
    var frac=total?Math.min(1,p.passed/total):0;
    var you=lane.querySelector('.lc-you');
    you.textContent=p.id===S.myId?'You':(p.online?'':'Left');
    you.style.display=you.textContent?'':'none';
    lane.querySelector('.lc-t').textContent=p.passed+' of '+total+' tests'+(p.subs?', '+p.subs+(p.subs===1?' try':' tries'):'');
    var rk=lane.querySelector('.lc-rk');
    var pos=ranked.indexOf(p)+1;
    rk.textContent=ordinal(pos);rk.className='chip lc-rk'+(pos===1&&p.passed>0?' acc':'');
    var tr=lane.querySelector('.track');
    tr.setAttribute('aria-label',p.name+' has passed '+p.passed+' of '+total+' tests');
    lane.querySelector('.rn').style.left='calc((100% - 50px) * '+frac+')';
  });
}
function updateBoard(){
  var b=$('#board');if(!b)return;
  if(b.getAttribute('data-key')!==laneKey())buildBoard();else paintBoard();
}
views.results=function(){
  var total=curProblem().tests.length;
  var ranked=rank(S.players);
  var w=null;for(var i=0;i<S.players.length;i++)if(S.players[i].id===S.winnerId)w=S.players[i];
  var me=myPlayer();
  var head;
  if(w){
    var crown=h('div',{class:'crown rise'});crown.appendChild(sprite(CROWN,colorOf(w.id),6));
    head=[crown,h('h2',{class:'win rise'},w.id===S.myId?'You win!':w.name+' wins'),
      h('p',{class:'small'},S.reason==='solved'?('Solved every test in '+fmtT(w.lastT)+'.'):'Most tests passed when time ran out.')];
  }else head=[h('h2',{class:'win rise'},'Time is up'),h('p',{class:'small'},'Nobody passed a test.')];
  var meScore=me?scoreOf(me.passed,total):1;
  return h('div',{class:'wrap'},h('div',{class:'narrow'},
    h('h1',{class:'logo sm'},'C-Slayer Duel'),
    head,
    h('div',{class:'panel',style:'margin-top:18px'},
      h('div',{class:'small'},'Your C-Slayer score'),
      h('div',{class:'score'},String(meScore),h('small',null,'out of 10')),
      h('div',{class:'small'},(me?me.passed:0)+' of '+total+' tests passed')),
    h('div',{class:'panel',style:'margin-top:16px'},
      ranked.map(function(p,i){return h('div',{class:'pl'},
        h('span',{class:'rb r'+(i+1)},String(i+1)),
        sprite(HERO,colorOf(p.id),3),
        h('span',{class:'nm',style:'flex:1'},p.name+(p.id===S.myId?' (you)':'')),
        h('span',{class:'small'},p.passed+'/'+total+' tests, score '+scoreOf(p.passed,total)));})),
    h('div',{class:'stack'},
      isHost()?h('button',{class:'btn pri',onclick:function(){
        S.phase='lobby';S.winnerId=null;S.reason='';
        S.players.forEach(function(p){p.passed=0;p.subs=0;p.lastT=0;});
        pushState();}},'Rematch'):h('p',{class:'small'},'Waiting for the host to start a rematch.'),
      h('button',{class:'btn ghost',onclick:function(){goHome();}},'Leave room'))));
};

/* ---------- render ---------- */
function render(){
  var v=S.screen==='home'?'home':S.phase==='lobby'?'lobby':S.phase==='live'?'arena':'results';
  if(v!==S.view){
    S.view=v;root.replaceChildren(views[v]());
    if(v==='arena')afterArenaBuild();
  }else if(v==='arena'){updateBoard();}
  else if(v!=='home'){root.replaceChildren(views[v]());}
}
if(!window.JSCPP||!window.Peer){root.textContent='Failed to load the C engine. Reload the page.';}
else render();
})();
