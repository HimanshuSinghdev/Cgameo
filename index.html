:root{
  --bg:#1a1446;--cab:#2b2170;--deep:#120d33;--edge:#4a3da8;--edge-d:#0e0a2b;
  --coin:#ffd23f;--coin-d:#9a7400;--hit:#ff5a67;--pass:#4fe3a1;--ice:#e9e6ff;--mut:#a79fe0;--lane:#221a5c;
  --ui:"Chakra Petch",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --px:"Press Start 2P","Chakra Petch",monospace;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ice);font:500 16px/1.5 var(--ui)}
#app{height:100dvh;display:flex;flex-direction:column;max-width:1240px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit;border-radius:0}
:focus-visible{outline:3px solid var(--ice);outline-offset:2px}

/* controls */
.btn{font:700 16px/1.1 var(--ui);color:var(--ice);background:var(--cab);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge-d);padding:0 18px;min-height:52px;cursor:pointer;touch-action:manipulation}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge-d)}
.btn.pri{background:var(--coin);border-color:var(--coin);color:var(--bg);box-shadow:0 4px 0 var(--coin-d)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:active:not(:disabled){transform:none;background:var(--cab)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.field{width:100%;background:var(--deep);border:3px solid var(--edge);padding:0 14px;min-height:52px}
.field::placeholder{color:var(--mut)}
.row .field{box-shadow:0 4px 0 var(--edge-d)}
label{display:block;font-weight:700;color:var(--mut);margin:18px 0 6px}

/* layout */
.wrap{padding:22px 18px calc(28px + env(safe-area-inset-bottom));overflow:auto;flex:1}
.narrow{max-width:460px;margin:0 auto;width:100%}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.row{display:flex;gap:12px;align-items:stretch}.row>*{flex:1;min-width:0}.row>.fix{flex:0 0 auto}
.panel{background:var(--cab);border:3px solid var(--edge);padding:14px 16px}
.small{font-size:14px;color:var(--mut)}
h1,h2,h3,p{margin:0}

/* title */
.logo{font:24px/1.35 var(--px);color:var(--ice);text-shadow:3px 3px 0 var(--hit);margin:6px 0 12px;overflow-wrap:anywhere}
.logo.sm{font-size:16px;text-shadow:2px 2px 0 var(--hit);margin:0 0 16px}
.tag{font-size:18px;color:var(--ice);margin-bottom:20px;max-width:30ch}

/* pixel race track */
.lanes{display:flex;flex-direction:column;gap:14px}
.lane-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-height:26px}
.lane-top .nm{flex:1;min-width:0}
.track{position:relative;height:46px;background:var(--lane);border:3px solid var(--edge);overflow:hidden}
.rn{position:absolute;left:0;bottom:5px;line-height:0;transition:left .6s steps(8)}
.flag{position:absolute;right:0;top:0;line-height:0}
.demo{display:flex;flex-direction:column;gap:10px;margin:4px 0 6px}
.demo .rn.a{animation:dash 2.2s steps(22) .4s forwards}
.demo .rn.b{animation:dash 2.7s steps(27) .4s forwards}
@keyframes dash{to{left:calc(100% - 50px)}}

/* players */
.pl{flex-wrap:wrap;row-gap:4px}
.pl .nm{flex:1 1 0;white-space:normal;overflow-wrap:break-word;line-height:1.25;min-width:60px}
.pl .chip{flex:0 0 auto}
.pl .small{margin-left:auto}
.pl{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:3px solid var(--bg)}
.pl:first-of-type{border-top:0}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font:700 12px/1 var(--ui);padding:5px 8px;background:var(--deep);border:2px solid var(--edge);color:var(--mut);white-space:nowrap}
.chip.acc{background:var(--coin);border-color:var(--coin);color:var(--bg)}
.codebox{font:32px/1 var(--px);letter-spacing:.2em;text-indent:.2em;text-align:center;color:var(--coin);background:var(--deep);border:3px solid var(--edge);padding:20px 8px;margin:10px 0 14px;cursor:pointer;user-select:all}

/* arena */
.hdr{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--cab);border-bottom:3px solid var(--edge)}
.hdr h2{font-size:17px;line-height:1.2;flex:1;min-width:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
@media(max-width:360px){.hdr{gap:8px;padding:8px}.hdr h2{font-size:15px}}
.hdr .btn{min-height:44px;min-width:44px;padding:0 10px;box-shadow:none}
#timer{font:16px/1 var(--px);min-width:80px;text-align:right}
#timer.low{color:var(--hit);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.tabs{display:flex;background:var(--cab);border-bottom:3px solid var(--edge)}
.tabs button{flex:1;border:0;border-bottom:4px solid transparent;background:transparent;color:var(--mut);font:700 16px var(--ui);min-height:48px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ice);border-bottom-color:var(--coin)}
.arena{flex:1;min-height:0;display:flex;flex-direction:column}
.panes{flex:1;min-height:0;display:flex}
.pane{display:none;flex:1;min-width:0;min-height:0;flex-direction:column;overflow:auto;padding:16px}
.pane.on{display:flex}
.pane[data-pane=problem]>*{flex-shrink:0}
.pane.codepane{padding:0}
.pane h3{font-size:20px;line-height:1.2}
.dm{display:inline-flex;gap:3px;align-items:center;flex:0 0 auto}
.dm i{width:10px;height:10px;background:var(--deep);border:2px solid var(--edge)}
.dm i.on{background:var(--coin);border-color:var(--coin)}
pre{margin:6px 0 14px;background:var(--deep);border:3px solid var(--edge);padding:10px 12px;font:14px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;overflow:auto}
.keys{touch-action:pan-x;overscroll-behavior-x:contain;display:flex;gap:8px;padding:8px;overflow-x:auto;background:var(--cab);border-bottom:3px solid var(--edge)}
.keys .btn{-webkit-user-select:none;user-select:none;min-height:42px;min-width:44px;padding:0 10px;font:700 16px var(--mono);flex:0 0 auto;box-shadow:0 3px 0 var(--edge-d)}
textarea#ed{flex:1;min-height:150px;width:100%;resize:none;border:0;background:var(--deep);color:var(--ice);font:14px/1.6 var(--mono);padding:12px;tab-size:4;white-space:pre;overflow:auto}
.con{border-top:3px solid var(--edge);background:var(--cab);padding:10px 12px;max-height:46%;overflow:auto;min-height:64px}
.con .t{font-weight:700;color:var(--mut);margin-bottom:4px}
.tests{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.tc{font:700 13px var(--mono);padding:4px 9px;border:2px solid var(--edge);background:var(--deep)}
.tc.ok{color:var(--pass);border-color:var(--pass)}.tc.no{color:var(--hit);border-color:var(--hit)}
.ok-t{color:var(--pass);font-weight:700}.no-t{color:var(--hit);font-weight:700}
.bar{display:flex;gap:12px;padding:12px 12px calc(14px + env(safe-area-inset-bottom));background:var(--cab);border-top:3px solid var(--edge)}
.bar .btn{flex:1}

.btn[aria-pressed=true]{background:var(--ice);border-color:var(--ice);color:var(--bg);box-shadow:0 4px 0 var(--mut)}
.hdr #langb{font-size:14px;min-width:44px}
.pbar{height:10px;background:var(--deep);border:2px solid var(--edge);margin:8px 0 4px}.pbar>i{display:block;height:100%;background:var(--pass)}
details.topic{background:var(--cab);border:3px solid var(--edge);margin-top:12px}
details.topic>summary{list-style:none;cursor:pointer;padding:12px 14px;min-height:52px}
details.topic>summary::-webkit-details-marker{display:none}
details.topic>summary .tn{font:700 17px/1.3 var(--ui);display:flex;justify-content:space-between;gap:10px}
details.topic .tbody{padding:0 14px 14px}
.prow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin-top:8px;min-height:48px;padding:0 12px}
.prow .t{flex:1;min-width:0}
.hintbox{margin-top:14px;max-width:60ch}.hintbox .h{padding:8px 0;border-top:2px solid var(--edge)}.hintbox .h:first-of-type{border-top:0}
.tip{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.tip .chip{flex:0 0 auto;margin-top:2px}
/* results */
.crown{margin:6px 0 12px;line-height:0}
.win{font:20px/1.4 var(--px);overflow-wrap:anywhere;margin-bottom:6px}
.score{font:48px/1 var(--px);color:var(--coin);margin:10px 0 6px}
.score small{font:700 18px var(--ui);color:var(--mut);margin-left:10px}
.rb{width:28px;height:28px;display:grid;place-items:center;font:700 15px var(--ui);background:var(--deep);border:2px solid var(--edge);color:var(--mut);flex:0 0 auto}
.rb.r1{background:var(--coin);border-color:var(--coin);color:var(--bg)}
.rb.r2{background:var(--ice);border-color:var(--ice);color:var(--bg)}
.rb.r3{background:#ff9b3d;border-color:#ff9b3d;color:var(--bg)}
.rise{animation:rise .5s steps(5) both}
@keyframes rise{from{transform:translateY(12px);opacity:0}}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ice);color:var(--bg);border:3px solid var(--bg);box-shadow:0 4px 0 var(--edge-d);font-weight:700;padding:10px 16px;z-index:9;max-width:90vw;opacity:0;pointer-events:none}
#toast.on{opacity:1}

@media(min-width:900px){
  .tabs{display:none}
  .pane{display:flex!important;border-right:3px solid var(--edge)}
  .pane:last-child{border-right:0}
  .pane.codepane{flex:1.7}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .demo .rn{left:calc(100% - 50px)}
}
</style>

],[/^too many arguments for format/,"You gave more values than the format string uses.","Add the missing % conversions or remove the extra values."],[/^suggest parentheses around assignment used as truth value/,"if (x = 5) assigns 5 to x (always true). You probably meant to compare.","Use == to compare: if (x == 5)."],[/makes pointer from integer without a cast/,"A plain number was used where an address (pointer) is needed.",'Use & to take an address, or a pointer variable; for strings use "..." or a char array.'],[/makes integer from pointer without a cast/,`An address was used where a number is needed (for example "a" is a string, but 'a' is a single character).`,`Use single quotes for one character ('a') and double quotes for strings ("abc").`],[/incompatible pointer type/,"The pointer types do not match (for example int* given where char* is expected).","Pass the right kind of pointer, or fix the declaration."],[/^array subscript (-?\d+) is (above|below) array bounds/,"You index beyond the end of an array. Valid indexes run from 0 to size-1.","Check the loop condition (< size, not <= size) and the array size."],[/returning address of local variable/,"A local variable disappears when the function returns, so its address becomes invalid.","Return the value instead, or use malloc / a static variable / a caller-provided buffer."],[/^'else' without a previous 'if'/,"else must come directly after an if (and its block).","Check for a stray ; after the if condition or a missing/extra brace."],[/^break statement not within loop or switch/,"break only works inside a loop or switch.","Use return to leave a function, or move the break inside the loop."],[/^continue statement not within a loop/,"continue only works inside a loop.","Move it inside a for/while/do loop."],[/^missing terminating " character/,'A string literal was opened with " but never closed on the same line.','Add the closing " (use \\n for a newline inside the string, not a real line break).'],[/^storage size of '(.+?)' isn't known/,"The type of '$1' is not defined (struct or typedef missing).","Define the struct before using it, or fix the type name."],[/^request for member '(.+?)' in something not a structure/,"You used .$1 on something that is not a struct.","Use -> for pointers to structs, . for struct variables; check the variable type."],[/^invalid type argument of '->'/,"-> is only for pointers to structs.","Use . when you have the struct itself, not a pointer."],[/^void value not ignored/,"You are using the result of a function that returns nothing (void).","Do not assign or print it; or change the function to return a value."],[/^initializer element is not constant/,"A global variable can only be initialised with constants, not with other variables or function calls.","Initialise it inside main (or another function) instead."],[/^size of array '(.+?)' is negative/,"An array size must be positive.","Check the number in the brackets."],[/^the 'gets' function is dangerous/,"gets cannot limit how much it reads, so it can overflow your buffer (and has been removed from C).","Use fgets(buf, sizeof buf, stdin)."],[/^defining variadic/,"Variadic functions are supported; this message should not appear.",""],[/^statement with no effect/,"This line computes a value and throws it away.","Did you mean an assignment (=) or a function call?"],[/misleading indentation/,"The indentation suggests a statement belongs to an if/loop, but without braces it does not.","Add { } around the body, or fix the indentation."],[/^switch quantity not an integer/,"switch only works on integers and characters, not strings or floats.","Use if / else if with strcmp for strings."],[/^duplicate case value/,"Two case labels have the same value.","Remove or change one of them."],[/^expected declaration specifiers/,"The compiler expected a type (like int) here. This often means a parenthesis/brace mistake above.","Check the previous lines for a missing ) or }."]],u={"heap-overflow":["You wrote (or read) past the end of memory you got from malloc.","Allocate enough bytes (n * sizeof(type)), and keep loop indexes below n. Remember C strings need one extra byte for the final \\0."],"use-after-free":["You used memory after free() had already given it back.","Do not touch a pointer after freeing it; set it to NULL right after free."],"double-free":["free() was called twice on the same memory.","Free each malloc exactly once; set the pointer to NULL after freeing."],"invalid-free":["free() was given something that did not come from malloc.","Only free pointers returned by malloc/calloc/realloc, exactly as returned."],segv:["The program touched memory it must not (NULL pointer, uninitialised pointer, or a read-only string literal).","Check pointers for NULL before using them, initialise them, and copy string literals into char arrays before modifying."],"stack-overflow":["The program used up its stack: usually infinite recursion or a huge local array.","Make sure recursion has a base case that stops, or move big arrays to the heap (malloc) or make them static."],"stack-overflow-array":["You wrote outside a local array.","Array indexes go from 0 to size-1. Check the loop limits."],"global-overflow":["You wrote outside a global array.","Array indexes go from 0 to size-1. Check the loop limits."],sigfpe:["Integer division (or %) by zero.","Check the divisor is not 0 before dividing."],timeout:["The program ran too long; most likely an infinite loop.","Check that the loop condition can become false and that the loop variable changes. You can raise the limit in the Tests tab."],"output-limit":["The program printed far too much output, probably in an endless loop.","Check the loop that contains printf."],abort:["abort() was called.","Look for the line that calls abort or a failing assert."],assert:["An assert() condition was false.","The condition shows what the program assumed; find out why it was not true."]};function c(o,a){return o.replace(/\$(\d)/g,(t,n)=>a[+n]!==void (function(n){"use strict";const e=n.CC=n.CC||{},l=[["C mein har statement ke end mein semicolon (;) lagta hai. Compiler ko tab pata chala jab wo '$1' tak pahunch gaya.","Upar wali line ke end mein ; laga do (aksar pichli line mein hi bhool hoti hai, jis line pe error dikh rahi hai uspe nahi)."],["Ek { khola gaya tha par kabhi band (}) nahi hua, isliye file bich mein hi khatam ho gayi.","Apne { aur } gino: har { ka ek } hona chahiye. Aakhri function check karo; auto-indent se gap dikh jata hai."],["Ek ( khola tha par uska ) nahi hai (ya beech mein koi extra cheez aa gayi).","Is line aur upar wali line ke brackets check karo."],["Compiler ko yahan value chahiye thi (jaise 5, x ya a+b) par '$1' mil gaya.","Dekho koi operand missing to nahi, koi operator double (jaise ++ +) to nahi, ya extra comma / semicolon to nahi."],["Aapne '$1' naam use kiya par is function mein kabhi declare nahi kiya.","Use karne se pehle declare karo (jaise int $1;), spelling ya capital/small letter ki galti dekho, ya sahi #include lagao."],["Aapne '$1' ko call kiya par compiler ko pata hi nahi ye kya hai. Aksar #include bhool gaye hote ho.","Sahi header lagao (message batata hai kaunsa, jaise #include <stdio.h>)."],["Har C program main naam ke function se start hota hai, aur yahan main hai hi nahi.","Ye likho: int main(void) { ... return 0; }"],["'$1' ko call kiya gaya par uski body kabhi likhi nahi (ya naam ki spelling galat hai).","Function define karo, ya declaration se spelling match karke dekho."],["Aapne '$1' ko zaroorat se kam values ke saath call kiya.","Function definition ke parameters ki ginti aur order se match karo."],["Aapne '$1' ko zaroorat se zyada values ke saath call kiya.","Extra values hata do, ya function mein parameters badha do."],["'$1' do baar alag-alag type ke saath declare hua hai (return type ya parameters alag).","Declaration aur definition bilkul ek jaise rakho."],["'$1' ek se zyada baar define ho gaya hai.","Duplicate hata do ya uska naam badal do."],["Array ka naam ek fixed jagah hota hai; poora array = se assign nahi kar sakte.","Ek-ek element copy karo, string ke liye strcpy, ya baaki arrays ke liye memcpy use karo."],["= ke left side pe aisi cheez honi chahiye jisme value store ho sake (variable), 5 ya x+1 jaisi value nahi.","= aur == ka farak dekho, aur left side pe koi extra operator to nahi."],["'$1' const declare hua tha, isliye badal nahi sakta.","const hata do, ya koi dusra variable use karo."],["Jo function value return karne ka vaada karta hai wo bina return kiye khatam ho sakta hai.","Har rasta (if/else ke baad bhi) return statement pe khatam hona chahiye."],["Variable '$1' ko value mile bina hi padh liya gaya, isliye usme kachra (garbage) hai.","Declare karte time value do (int $1 = 0;) ya use karne se pehle assign karo."],["'$1' declare hua par kabhi use nahi hua.","Hata do ya use karo. Unused variable aksar kahin aur typo ka sanket hota hai."],["Aap '$1' mein value store karte ho par kabhi padhte nahi.","Value ko print/return/compare karo, ya variable hata do."],["printf/scanf ka format %$1 ko '$2' chahiye par aapne '$4' diya. Mismatch se garbage print hota hai ya crash.","int ke liye %d, long ke liye %ld, float/double ke liye %f (scanf mein double ke liye %lf), char ke liye %c, string ke liye %s."],["Format string mein % zyada hain, values kam di gayi hain.","Har % ke liye ek value do."],["Aapne format string se zyada values de di.","Missing % lagao ya extra values hata do."],["if (x = 5) x mein 5 daal deta hai (hamesha true). Shayad aap compare karna chahte the.","Compare ke liye == use karo: if (x == 5)."],["Jahan address (pointer) chahiye tha wahan simple number de diya.",'Address ke liye & lagao, ya pointer variable do; string ke liye "..." ya char array use karo.'],[`Jahan number chahiye tha wahan address de diya (jaise "a" string hai, par 'a' ek akshar).`,`Ek akshar ke liye single quotes ('a'), string ke liye double quotes ("abc") use karo.`],["Pointer ke types match nahi karte (jaise char* chahiye tha aur int* de diya).","Sahi type ka pointer do ya declaration theek karo."],["Aap array ke end ke aage index kar rahe ho. Valid index 0 se size-1 tak hote hain.","Loop condition dekho (< size, <= size nahi) aur array ka size check karo."],["Local variable function khatam hote hi gayab ho jata hai, isliye uska address invalid ho jata hai.","Value return karo, ya malloc / static variable / caller ka buffer use karo."],["else hamesha if (aur uske block) ke turant baad aana chahiye.","if ki condition ke baad extra ; ya missing/extra brace dekho."],["break sirf loop ya switch ke andar chalta hai.","Function se nikalne ke liye return use karo, ya break ko loop ke andar rakho."],["continue sirf loop ke andar chalta hai.","Ise for/while/do loop ke andar rakho."],['String " se shuru hui par usi line mein band nahi hui.','Closing " laga do (string ke andar nayi line ke liye \\n use karo, asli line break nahi).'],["'$1' ka type define nahi hai (struct ya typedef missing).","Use karne se pehle struct define karo, ya type ka naam theek karo."],["Aapne .$1 aisi cheez pe use kiya jo struct nahi hai.","Struct ke pointer ke liye -> aur struct variable ke liye . use karo; variable ka type check karo."],["-> sirf struct ke pointer ke liye hota hai.","Jab aapke paas pointer nahi balki khud struct ho to . use karo."],["Aap aise function ka result use kar rahe ho jo kuch return hi nahi karta (void).","Use assign ya print mat karo; ya function ko value return karne wala bana do."],["Global variable sirf constants se initialise ho sakta hai, doosre variables ya function call se nahi.","Use main (ya kisi aur function) ke andar initialise karo."],["Array ka size positive hona chahiye.","Brackets ke andar ka number check karo."],["gets ye limit nahi kar sakta ki kitna padhna hai, isliye buffer overflow ho sakta hai (aur C se hata diya gaya hai).","fgets(buf, sizeof buf, stdin) use karo."],["Variadic functions supported hain; ye message nahi aana chahiye.",""],["Ye line ek value nikalti hai aur r kya bachta hai.","n % 2 remainder deta hai. Even mein 0 aata hai.","if (n % 2 == 0) to Even, warna Odd. Negative mein -3 % 2 = -1, isliye sirf == 0 test karo."]},{"id":"fact","title":"Factorial","en":"Read n (0 to 20). Print n! (fits in long long).","hi":"n padho (0 se 20). n! print karo (long long mein aata hai).","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"5\n","expected":"120\n","hidden":false},{"name":"Example 2","input":"1\n","expected":"1\n","hidden":false},{"name":"Hidden test 3","input":"0\n","expected":"1\n","hidden":true},{"name":"Hidden test 4","input":"10\n","expected":"3628800\n","hidden":true},{"name":"Hidden test 5","input":"20\n","expected":"2432902008176640000\n","hidden":true}],"diff":2,"topic":"loops","hints":["n! is 1 * 2 * ... * n and 0! is 1.","Start with long long r = 1; and multiply by i for i from 2 to n.","20! needs long long. Print with %lld."],"hintsHi":["n! = 1 * 2 * ... * n aur 0! = 1.","long long r = 1; se shuru karo aur i = 2 se n tak r *= i.","20! ke liye long long chahiye. %lld se print karo."]},{"id":"fib","title":"Fibonacci","en":"Read n (0 to 90). Print the n-th Fibonacci number (F0=0, F1=1). It must be fast for n = 90.","hi":"n padho (0 se 90). n-th Fibonacci number print karo (F0=0, F1=1). n = 90 par bhi tez chalna chahiye.","starter":"#include <stdio.h>\n\nint main(void) {\n    int n;\n    scanf(\"%d\", &n);\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"10\n","expected":"55\n","hidden":false},{"name":"Hidden test 2","input":"1\n","expected":"1\n","hidden":true},{"name":"Hidden test 3","input":"0\n","expected":"0\n","hidden":true},{"name":"Hidden test 4","input":"2\n","expected":"1\n","hidden":true},{"name":"Hidden test 5","input":"50\n","expected":"12586269025\n","hidden":true},{"name":"Hidden test 6","input":"90\n","expected":"2880067194370816120\n","hidden":true}],"diff":4,"topic":"recur","hints":["Plain recursion repeats the same work and explodes for n = 90.","Keep just two values and move them forward in a loop.","a = 0, b = 1; repeat n times: t = a + b; a = b; b = t; Use long long. Print a."],"hintsHi":["Seedhi recursion wahi kaam baar baar karti hai aur n = 90 par fat jaati hai.","Sirf do values rakho aur loop mein aage badhao.","a = 0, b = 1; n baar: t = a + b; a = b; b = t; long long lo. a print karo."]},{"id":"prime","title":"Prime check","en":"Read n. Print \"Prime\" or \"Not prime\". Remember 0 and 1 are not prime. n can be up to 1000000007.","hi":"n padho. \"Prime\" ya \"Not prime\" print karo. Yaad rakho 0 aur 1 prime nahi hain. n 1000000007 tak ho sakta hai.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"7\n","expected":"Prime\n","hidden":false},{"name":"Example 2","input":"10\n","expected":"Not prime\n","hidden":false},{"name":"Hidden test 3","input":"2\n","expected":"Prime\n","hidden":true},{"name":"Hidden test 4","input":"1\n","expected":"Not prime\n","hidden":true},{"name":"Hidden test 5","input":"0\n","expected":"Not prime\n","hidden":true},{"name":"Hidden test 6","input":"1000000007\n","expected":"Prime\n","hidden":true},{"name":"Hidden test 7","input":"999999937\n","expected":"Prime\n","hidden":true},{"name":"Hidden test 8","input":"-7\n","expected":"Not prime\n","hidden":true}],"diff":4,"topic":"loops","hints":["A number is prime if nothing from 2 up to its square root divides it.","Loop i from 2 while i * i <= n using long long, and stop at the first divisor.","Numbers below 2 are not prime. Testing up to n would be far too slow for 10^9."],"hintsHi":["Number prime hai agar 2 se uski square root tak koi usse divide na kare.","long long ke saath i = 2 se i * i <= n tak loop chalao aur pehle divisor par ruk jao.","2 se chhote numbers prime nahi hote. n tak test karna 10^9 ke liye bahut slow hoga."]},{"id":"digits","title":"Sum of digits","en":"Read a non-negative integer. Print the sum of its digits.","hi":"Ek non-negative integer padho. Uske digits ka sum print karo.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"123\n","expected":"6\n","hidden":false},{"name":"Example 2","input":"9\n","expected":"9\n","hidden":false},{"name":"Hidden test 3","input":"0\n","expected":"0\n","hidden":true},{"name":"Hidden test 4","input":"1000000\n","expected":"1\n","hidden":true},{"name":"Hidden test 5","input":"987654321012\n","expected":"48\n","hidden":true}],"diff":2,"topic":"loops","hints":["Peel digits off one at a time.","n % 10 is the last digit, n / 10 removes it. Repeat while n > 0.","sum += n % 10; n /= 10; inside while (n > 0)."],"hintsHi":["Digits ek ek karke nikalo.","n % 10 last digit hai, n / 10 use hata deta hai. n > 0 tak repeat karo.","while (n > 0) ke andar sum += n % 10; n /= 10;"]},{"id":"gcd","title":"GCD","en":"Read two positive integers. Print their greatest common divisor.","hi":"Do positive integers padho. Unka GCD (greatest common divisor) print karo.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"12 18\n","expected":"6\n","hidden":false},{"name":"Example 2","input":"17 5\n","expected":"1\n","hidden":false},{"name":"Hidden test 3","input":"7 7\n","expected":"7\n","hidden":true},{"name":"Hidden test 4","input":"1 1000000000000\n","expected":"1\n","hidden":true},{"name":"Hidden test 5","input":"600851475143 6857\n","expected":"6857\n","hidden":true}],"diff":3,"topic":"loops","hints":["Euclid noticed gcd(a, b) = gcd(b, a % b).","Loop while (b != 0) { t = a % b; a = b; b = t; }","When b becomes 0, a is the answer."],"hintsHi":["Euclid ne dekha ki gcd(a, b) = gcd(b, a % b).","while (b != 0) { t = a % b; a = b; b = t; }","Jab b 0 ho jaye, a hi answer hai."]},{"id":"maxn","title":"Largest of n numbers","en":"First read n (n >= 1), then n integers. Print the largest. Numbers may be negative.","hi":"Pehle n padho (n >= 1), phir n integers. Sabse bada print karo. Numbers negative ho sakte hain.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"5\n3 9 2 7 1\n","expected":"9\n","hidden":false},{"name":"Example 2","input":"3\n-5 -2 -9\n","expected":"-2\n","hidden":false},{"name":"Hidden test 3","input":"1\n42\n","expected":"42\n","hidden":true},{"name":"Hidden test 4","input":"4\n-1 -1 -1 -1\n","expected":"-1\n","hidden":true},{"name":"Hidden test 5","input":"6\n1 2 3 4 5 2147483648\n","expected":"2147483648\n","hidden":true}],"diff":2,"topic":"arrays","hints":["You do not need to store every number, just the best so far.","Read the first number into max, then compare each new one.","Read n, then loop n-1 more times: if (x > max) max = x; Start from the first value, not from 0, because numbers can be negative."],"hintsHi":["Har number store karna zaroori nahi, sirf ab tak ka best.","Pehla number max mein lo, phir har naye se compare karo.","n padho, phir n-1 baar loop: if (x > max) max = x; 0 se nahi, pehle value se shuru karo kyunki numbers negative ho sakte hain."]},{"id":"palin","title":"Palindrome word","en":"Read one word (no spaces, at most 100 letters). Print \"Yes\" if it reads the same backwards, else \"No\".","hi":"Ek word padho (spaces nahi, 100 letters tak). Agar ulta padhne par bhi wahi ho to \"Yes\", warna \"No\" print karo.","starter":"#include <stdio.h>\n#include <string.h>\n\nint main(void) {\n    char s[101];\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"level\n","expected":"Yes\n","hidden":false},{"name":"Example 2","input":"hello\n","expected":"No\n","hidden":false},{"name":"Hidden test 3","input":"a\n","expected":"Yes\n","hidden":true},{"name":"Hidden test 4","input":"abba\n","expected":"Yes\n","hidden":true},{"name":"Hidden test 5","input":"abca\n","expected":"No\n","hidden":true},{"name":"Hidden test 6","input":"racecar\n","expected":"Yes\n","hidden":true}],"diff":3,"topic":"strings","hints":["Compare the word with itself backwards.","Use two indices, i from the start and j from the end, and move them toward each other.","If s[i] != s[j] at any step it is not a palindrome. Get the length with strlen."],"hintsHi":["Word ko uske ulte se compare karo.","Do indices lo, i shuru se aur j end se, aur dono ko beech ki taraf badhao.","Kisi bhi step par s[i] != s[j] ho to palindrome nahi. Length strlen se lo."]},{"id":"vowels","title":"Count vowels","en":"Read one line (up to 200 characters, spaces allowed). Print how many vowels (a, e, i, o, u, either case) it has.","hi":"Ek line padho (200 characters tak, spaces ho sakte hain). Usme kitne vowels (a, e, i, o, u, chhote ya bade) hain print karo.","starter":"#include <stdio.h>\n\nint main(void) {\n    char line[256];\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"Hello World\n","expected":"3\n","hidden":false},{"name":"Example 2","input":"rhythm\n","expected":"0\n","hidden":false},{"name":"Hidden test 3","input":"AEIOU aeiou\n","expected":"10\n","hidden":true},{"name":"Hidden test 4","input":"\n","expected":"0\n","hidden":true},{"name":"Hidden test 5","input":"The quick brown fox jumps over the lazy dog\n","expected":"11\n","hidden":true}],"diff":3,"topic":"strings","hints":["First read the whole line, spaces included.","Use fgets(s, sizeof s, stdin) because scanf(\"%s\") stops at a space.","Loop over characters; lowercase each with tolower and test against a, e, i, o, u."],"hintsHi":["Pehle poori line padho, spaces ke saath.","fgets(s, sizeof s, stdin) use karo kyunki scanf(\"%s\") space par ruk jata hai.","Characters par loop chalao; tolower se chhota karo aur a, e, i, o, u se compare karo."]},{"id":"rect","title":"Rectangle","diff":1,"en":"Read width w and height h (integers). Print the area and the perimeter, separated by a space.","hi":"Width w aur height h padho (integers). Area aur perimeter print karo, beech mein space.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"3 4\n","expected":"12 14\n","hidden":false},{"name":"Example 2","input":"10 10\n","expected":"100 40\n","hidden":false},{"name":"Hidden test 3","input":"1 1\n","expected":"1 4\n","hidden":true},{"name":"Hidden test 4","input":"0 7\n","expected":"0 14\n","hidden":true},{"name":"Hidden test 5","input":"1000000 1000000\n","expected":"1000000000000 4000000\n","hidden":true}],"topic":"io","hints":["Area and perimeter both come from w and h.","area = w * h and perimeter = 2 * (w + h).","Print both in one printf with a space between: printf(\"%d %d\\n\", area, per);"],"hintsHi":["Area aur perimeter dono w aur h se nikalte hain.","area = w * h aur perimeter = 2 * (w + h).","Ek hi printf mein space ke saath print karo: printf(\"%d %d\\n\", area, per);"]},{"id":"temp","title":"Celsius to Fahrenheit","diff":1,"en":"Read a temperature in Celsius (an integer). Print it in Fahrenheit with exactly one decimal place. F = C * 9 / 5 + 32.","hi":"Celsius temperature padho (integer). Fahrenheit mein ek decimal ke saath print karo. F = C * 9 / 5 + 32.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"0\n","expected":"32.0\n","hidden":false},{"name":"Example 2","input":"100\n","expected":"212.0\n","hidden":false},{"name":"Hidden test 3","input":"-40\n","expected":"-40.0\n","hidden":true},{"name":"Hidden test 4","input":"37\n","expected":"98.6\n","hidden":true},{"name":"Hidden test 5","input":"-273\n","expected":"-459.4\n","hidden":true},{"name":"Hidden test 6","input":"36\n","expected":"96.8\n","hidden":true}],"topic":"io","hints":["The formula mixes whole numbers and a decimal result.","Use double: f = c * 9.0 / 5 + 32. The 9.0 forces decimal math.","Print with one decimal: printf(\"%.1f\\n\", f);"],"hintsHi":["Formula mein decimal result aata hai.","double lo: f = c * 9.0 / 5 + 32. 9.0 decimal math karwata hai.","Ek decimal ke saath print karo: printf(\"%.1f\\n\", f);"]},{"id":"sign","title":"Positive, negative or zero","diff":1,"en":"Read an integer (it can be very large). Print Positive, Negative or Zero.","hi":"Ek integer padho (bahut bada bhi ho sakta hai). Positive, Negative ya Zero print karo.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"5\n","expected":"Positive\n","hidden":false},{"name":"Example 2","input":"-3\n","expected":"Negative\n","hidden":false},{"name":"Hidden test 3","input":"0\n","expected":"Zero\n","hidden":true},{"name":"Hidden test 4","input":"9999999999\n","expected":"Positive\n","hidden":true},{"name":"Hidden test 5","input":"-9999999999\n","expected":"Negative\n","hidden":true}],"topic":"cond","hints":["There are three outcomes, so one if is not enough.","Use long long because the number can be very large. Compare with 0.","if (n > 0) ... else if (n < 0) ... else ... Print the matching word."],"hintsHi":["Teen outcomes hain, ek if kaafi nahi.","long long lo kyunki number bahut bada ho sakta hai. 0 se compare karo.","if (n > 0) ... else if (n < 0) ... else ... Sahi word print karo."]},{"id":"swapw","title":"Swap two words","diff":1,"en":"Read two words (no spaces, at most 100 letters each). Print them in swapped order, separated by a space.","hi":"Do words padho (spaces nahi, har ek 100 letters tak). Unko ulte order mein print karo, beech mein space.","starter":"#include <stdio.h>\n#include <string.h>\n\nint main(void) {\n    char s[101];\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"hello world\n","expected":"world hello\n","hidden":false},{"name":"Example 2","input":"apple banana\n","expected":"banana apple\n","hidden":false},{"name":"Hidden test 3","input":"same same\n","expected":"same same\n","hidden":true},{"name":"Hidden test 4","input":"a b\n","expected":"b a\n","hidden":true},{"name":"Hidden test 5","input":"C Slayer\n","expected":"Slayer C\n","hidden":true}],"topic":"io","hints":["Words are read as strings, not numbers.","Use two char arrays like char a[101], b[101]; and scanf(\"%s %s\", a, b); (no & for arrays).","Just print them in the opposite order: printf(\"%s %s\\n\", b, a);"],"hintsHi":["Words numbers nahi, strings hote hain.","Do char arrays lo: char a[101], b[101]; scanf(\"%s %s\", a, b); (array ke saath & nahi).","Ulte order mein print karo: printf(\"%s %s\\n\", b, a);"]},{"id":"leap","title":"Leap year","diff":1,"en":"Read a year. Print Leap if it is a leap year, otherwise Not leap. A year is a leap year if it is divisible by 4, except years divisible by 100, unless they are also divisible by 400.","hi":"Ek saal (year) padho. Leap year ho to Leap, warna Not leap print karo. 4 se divisible ho to leap, par 100 se divisible ho to nahi, jab tak 400 se bhi divisible na ho.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"2024\n","expected":"Leap\n","hidden":false},{"name":"Example 2","input":"2023\n","expected":"Not leap\n","hidden":false},{"name":"Hidden test 3","input":"1900\n","expected":"Not leap\n","hidden":true},{"name":"Hidden test 4","input":"2000\n","expected":"Leap\n","hidden":true},{"name":"Hidden test 5","input":"2100\n","expected":"Not leap\n","hidden":true},{"name":"Hidden test 6","input":"400\n","expected":"Leap\n","hidden":true},{"name":"Hidden test 7","input":"1\n","expected":"Not leap\n","hidden":true}],"topic":"cond","hints":["There are three rules, and the order matters.","Leap if divisible by 400, or divisible by 4 but not by 100.","if ((y % 400 == 0) || (y % 4 == 0 && y % 100 != 0)) print Leap."],"hintsHi":["Teen rules hain aur order matter karta hai.","Leap agar 400 se divisible ho, ya 4 se ho par 100 se nahi.","if ((y % 400 == 0) || (y % 4 == 0 && y % 100 != 0)) to Leap print karo."]},{"id":"sumn","title":"Sum from 1 to n","diff":2,"en":"Read n (1 <= n <= 1000000). Print 1 + 2 + ... + n.","hi":"n padho (1 <= n <= 1000000). 1 + 2 + ... + n print karo.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"10\n","expected":"55\n","hidden":false},{"name":"Example 2","input":"100\n","expected":"5050\n","hidden":false},{"name":"Hidden test 3","input":"1\n","expected":"1\n","hidden":true},{"name":"Hidden test 4","input":"65536\n","expected":"2147516416\n","hidden":true},{"name":"Hidden test 5","input":"1000000\n","expected":"500000500000\n","hidden":true}],"topic":"loops","hints":["You could add 1, then 2, then 3 in a loop.","for (int i = 1; i <= n; i++) total += i; Use long long total.","Or use the formula n * (n + 1) / 2 and skip the loop. Use long long to avoid overflow."],"hintsHi":["1, phir 2, phir 3 loop mein jod sakte ho.","for (int i = 1; i <= n; i++) total += i; total ko long long rakho.","Ya formula n * (n + 1) / 2 lagao, loop ki zaroorat nahi. Overflow se bachne ke liye long long lo."]},{"id":"evensum","title":"Sum of even numbers","diff":2,"en":"First read n, then n integers. Print the sum of the even ones (0 if there are none). The sum can be large.","hi":"Pehle n padho, phir n integers. Even numbers ka sum print karo (koi even na ho to 0). Sum bada ho sakta hai.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"5\n1 2 3 4 5\n","expected":"6\n","hidden":false},{"name":"Example 2","input":"3\n-2 -4 7\n","expected":"-6\n","hidden":false},{"name":"Hidden test 3","input":"4\n1 3 5 7\n","expected":"0\n","hidden":true},{"name":"Hidden test 4","input":"1\n0\n","expected":"0\n","hidden":true},{"name":"Hidden test 5","input":"3\n2000000000 2000000000 2\n","expected":"4000000002\n","hidden":true}],"topic":"loops","hints":["Add only the numbers that pass a test.","Read each number in a loop and check x % 2 == 0.","if (x % 2 == 0) sum += x; Use long long for sum."],"hintsHi":["Sirf test pass karne wale numbers jodo.","Loop mein har number padho aur x % 2 == 0 check karo.","if (x % 2 == 0) sum += x; sum long long rakho."]},{"id":"minmax","title":"Smallest and largest","diff":2,"en":"First read n (n >= 1), then n integers. Print the smallest and the largest, separated by a space.","hi":"Pehle n padho (n >= 1), phir n integers. Sabse chhota aur sabse bada print karo, beech mein space.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"5\n3 9 2 7 1\n","expected":"1 9\n","hidden":false},{"name":"Example 2","input":"1\n42\n","expected":"42 42\n","hidden":false},{"name":"Hidden test 3","input":"4\n-5 -1 -9 -3\n","expected":"-9 -1\n","hidden":true},{"name":"Hidden test 4","input":"3\n2147483648 -2147483649 0\n","expected":"-2147483649 2147483648\n","hidden":true},{"name":"Hidden test 5","input":"6\n7 7 7 7 7 7\n","expected":"7 7\n","hidden":true}],"topic":"arrays","hints":["Track two values while reading.","Set both min and max to the first number, then update either one when a number beats it.","if (x < mn) mn = x; if (x > mx) mx = x; Print mn then mx."],"hintsHi":["Padhte waqt do values track karo.","min aur max dono ko pehle number se set karo, phir jo beat kare use update karo.","if (x < mn) mn = x; if (x > mx) mx = x; pehle mn phir mx print karo."]},{"id":"revnum","title":"Reverse a number","diff":2,"en":"Read a non-negative integer. Print its digits in reverse order as a number. Leading zeros of the result are dropped (1200 becomes 21, and 0 stays 0).","hi":"Ek non-negative integer padho. Uske digits ulte order mein number ki tarah print karo. Result ke aage ke zeros hat jaate hain (1200 se 21, 0 se 0).","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"1200\n","expected":"21\n","hidden":false},{"name":"Example 2","input":"12345\n","expected":"54321\n","hidden":false},{"name":"Hidden test 3","input":"0\n","expected":"0\n","hidden":true},{"name":"Hidden test 4","input":"1000000\n","expected":"1\n","hidden":true},{"name":"Hidden test 5","input":"987654321\n","expected":"123456789\n","hidden":true},{"name":"Hidden test 6","input":"10\n","expected":"1\n","hidden":true}],"topic":"loops","hints":["Build the answer by pushing digits onto it.","rev = rev * 10 + n % 10; then n /= 10; until n is 0.","Trailing zeros of the input vanish naturally (120 becomes 21). Print rev; 0 should print 0."],"hintsHi":["Answer digits ko dhakel ke banao.","rev = rev * 10 + n % 10; phir n /= 10; jab tak n 0 na ho.","Input ke aakhri zeros apne aap gayab ho jaate hain (120 se 21). rev print karo; 0 par 0 aana chahiye."]},{"id":"table","title":"Multiplication table","diff":2,"en":"Read n. Print its multiplication table from 1 to 10, one line per row, in the format: n x i = result (for example: 7 x 3 = 21).","hi":"n padho. Uska 1 se 10 tak table print karo, har row alag line mein, is format mein: n x i = result (jaise: 7 x 3 = 21).","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"7\n","expected":"7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35\n7 x 6 = 42\n7 x 7 = 49\n7 x 8 = 56\n7 x 9 = 63\n7 x 10 = 70\n","hidden":false},{"name":"Example 2","input":"12\n","expected":"12 x 1 = 12\n12 x 2 = 24\n12 x 3 = 36\n12 x 4 = 48\n12 x 5 = 60\n12 x 6 = 72\n12 x 7 = 84\n12 x 8 = 96\n12 x 9 = 108\n12 x 10 = 120\n","hidden":false},{"name":"Hidden test 3","input":"1\n","expected":"1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n1 x 4 = 4\n1 x 5 = 5\n1 x 6 = 6\n1 x 7 = 7\n1 x 8 = 8\n1 x 9 = 9\n1 x 10 = 10\n","hidden":true},{"name":"Hidden test 4","input":"0\n","expected":"0 x 1 = 0\n0 x 2 = 0\n0 x 3 = 0\n0 x 4 = 0\n0 x 5 = 0\n0 x 6 = 0\n0 x 7 = 0\n0 x 8 = 0\n0 x 9 = 0\n0 x 10 = 0\n","hidden":true},{"name":"Hidden test 5","input":"-3\n","expected":"-3 x 1 = -3\n-3 x 2 = -6\n-3 x 3 = -9\n-3 x 4 = -12\n-3 x 5 = -15\n-3 x 6 = -18\n-3 x 7 = -21\n-3 x 8 = -24\n-3 x 9 = -27\n-3 x 10 = -30\n","hidden":true},{"name":"Hidden test 6","input":"99999\n","expected":"99999 x 1 = 99999\n99999 x 2 = 199998\n99999 x 3 = 299997\n99999 x 4 = 399996\n99999 x 5 = 499995\n99999 x 6 = 599994\n99999 x 7 = 699993\n99999 x 8 = 799992\n99999 x 9 = 899991\n99999 x 10 = 999990\n","hidden":true}],"topic":"loops","hints":["One line per i from 1 to 10.","for (int i = 1; i <= 10; i++) and one printf inside.","printf(\"%d x %d = %d\\n\", n, i, n * i); matches the format exactly, including spaces."],"hintsHi":["i = 1 se 10 tak har ek ke liye ek line.","for (int i = 1; i <= 10; i++) aur andar ek printf.","printf(\"%d x %d = %d\\n\", n, i, n * i); format spaces ke saath bilkul match hona chahiye."]},{"id":"cntdig","title":"Count the digits","diff":2,"en":"Read an integer (it may be negative or very large). Print how many digits it has, ignoring the minus sign. The number 0 has one digit.","hi":"Ek integer padho (negative ya bahut bada ho sakta hai). Usme kitne digits hain print karo, minus sign ginti mein nahi. 0 mein ek digit hota hai.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"12345\n","expected":"5\n","hidden":false},{"name":"Example 2","input":"0\n","expected":"1\n","hidden":false},{"name":"Hidden test 3","input":"-987\n","expected":"3\n","hidden":true},{"name":"Hidden test 4","input":"1000000000000\n","expected":"13\n","hidden":true},{"name":"Hidden test 5","input":"7\n","expected":"1\n","hidden":true}],"topic":"loops","hints":["The minus sign is not a digit.","Use long long, take the absolute value, then count how many times you can divide by 10.","Special case: 0 has 1 digit, so use a do-while or handle it first."],"hintsHi":["Minus sign digit nahi hota.","long long lo, absolute value lo, phir gino kitni baar 10 se divide kar sakte ho.","Special case: 0 mein 1 digit hota hai, isliye do-while use karo ya pehle handle karo."]},{"id":"grade","title":"Marks to grade","diff":2,"en":"Read marks (0 to 100). Print the grade: A for 90 or more, B for 80 to 89, C for 70 to 79, D for 60 to 69, otherwise F.","hi":"Marks padho (0 se 100). Grade print karo: 90 ya zyada par A, 80 se 89 par B, 70 se 79 par C, 60 se 69 par D, baaki sab F.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"95\n","expected":"A\n","hidden":false},{"name":"Example 2","input":"85\n","expected":"B\n","hidden":false},{"name":"Hidden test 3","input":"72\n","expected":"C\n","hidden":true},{"name":"Hidden test 4","input":"60\n","expected":"D\n","hidden":true},{"name":"Hidden test 5","input":"59\n","expected":"F\n","hidden":true},{"name":"Hidden test 6","input":"100\n","expected":"A\n","hidden":true},{"name":"Hidden test 7","input":"0\n","expected":"F\n","hidden":true},{"name":"Hidden test 8","input":"89\n","expected":"B\n","hidden":true},{"name":"Hidden test 9","input":"90\n","expected":"A\n","hidden":true},{"name":"Hidden test 10","input":"79\n","expected":"C\n","hidden":true}],"topic":"cond","hints":["Check from the highest grade down so each case is simple.","if (m >= 90) A; else if (m >= 80) B; ... the else-if chain handles ranges.","The last else prints F for anything below 60."],"hintsHi":["Sabse upar wale grade se neeche ki taraf check karo.","if (m >= 90) A; else if (m >= 80) B; ... else-if chain ranges sambhalti hai.","Aakhri else 60 se neeche ke liye F print karta hai."]},{"id":"power","title":"Power","diff":2,"en":"Read a and b (0 <= a <= 10, 0 <= b <= 18). Print a to the power b. Treat 0 to the power 0 as 1. The answer fits in long long.","hi":"a aur b padho (0 <= a <= 10, 0 <= b <= 18). a ki power b print karo. 0 ki power 0 ko 1 maano. Answer long long mein aata hai.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"2 10\n","expected":"1024\n","hidden":false},{"name":"Example 2","input":"3 4\n","expected":"81\n","hidden":false},{"name":"Hidden test 3","input":"7 0\n","expected":"1\n","hidden":true},{"name":"Hidden test 4","input":"0 5\n","expected":"0\n","hidden":true},{"name":"Hidden test 5","input":"0 0\n","expected":"1\n","hidden":true},{"name":"Hidden test 6","input":"10 18\n","expected":"1000000000000000000\n","hidden":true},{"name":"Hidden test 7","input":"9 18\n","expected":"150094635296999121\n","hidden":true}],"topic":"loops","hints":["Multiplying a by itself b times gives a^b.","long long r = 1; for (int i = 0; i < b; i++) r *= a;","0 to the power 0 is 1 automatically because r starts at 1. 10^18 still fits in long long."],"hintsHi":["a ko b baar khud se guna karo to a^b milta hai.","long long r = 1; for (int i = 0; i < b; i++) r *= a;","0^0 apne aap 1 aata hai kyunki r 1 se shuru hota hai. 10^18 long long mein aata hai."]},{"id":"binary","title":"Decimal to binary","diff":3,"en":"Read n (0 <= n <= 2000000000). Print n in binary without leading zeros (0 prints as 0).","hi":"n padho (0 <= n <= 2000000000). n ko binary mein print karo, aage ke zero ke bina (0 ka binary 0).","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"10\n","expected":"1010\n","hidden":false},{"name":"Example 2","input":"0\n","expected":"0\n","hidden":false},{"name":"Hidden test 3","input":"1\n","expected":"1\n","hidden":true},{"name":"Hidden test 4","input":"255\n","expected":"11111111\n","hidden":true},{"name":"Hidden test 5","input":"1024\n","expected":"10000000000\n","hidden":true},{"name":"Hidden test 6","input":"2000000000\n","expected":"1110111001101011001010000000000\n","hidden":true}],"topic":"loops","hints":["Binary comes from repeatedly dividing by 2.","The remainders n % 2, read from last to first, are the bits.","Store bits in an array while n > 0, then print the array backwards. Handle n = 0 separately."],"hintsHi":["Binary 2 se baar baar divide karne se aata hai.","Remainders n % 2 ko aakhri se pehle tak padho, wahi bits hain.","n > 0 tak bits array mein rakho, phir array ulta print karo. n = 0 alag handle karo."]},{"id":"armstrong","title":"Armstrong number","diff":3,"en":"Read n (n >= 0). Print Yes if n equals the sum of its digits, each raised to the power of the number of digits, otherwise No. For example 153 = 1^3 + 5^3 + 3^3. Single digits (and 0) count.","hi":"n padho (n >= 0). Agar n apne digits ki power-sum ke barabar ho (har digit ki power = digits ki ginti) to Yes, warna No. Jaise 153 = 1^3 + 5^3 + 3^3. Ek digit wale numbers (aur 0) bhi Armstrong hain.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"153\n","expected":"Yes\n","hidden":false},{"name":"Example 2","input":"154\n","expected":"No\n","hidden":false},{"name":"Hidden test 3","input":"9\n","expected":"Yes\n","hidden":true},{"name":"Hidden test 4","input":"0\n","expected":"Yes\n","hidden":true},{"name":"Hidden test 5","input":"9474\n","expected":"Yes\n","hidden":true},{"name":"Hidden test 6","input":"9475\n","expected":"No\n","hidden":true},{"name":"Hidden test 7","input":"10\n","expected":"No\n","hidden":true},{"name":"Hidden test 8","input":"54748\n","expected":"Yes\n","hidden":true},{"name":"Hidden test 9","input":"92727\n","expected":"Yes\n","hidden":true}],"topic":"loops","hints":["First count the digits, then add each digit raised to that count.","Use a loop for counting, a second loop to peel digits, and a small power loop (or pow with care).","Compare the total with the original n, so keep a copy of n before you destroy it."],"hintsHi":["Pehle digits gino, phir har digit ko us count ki power par uthakar jodo.","Ginne ke liye ek loop, digits nikalne ke liye doosra loop, aur chhota power loop.","Total ko original n se compare karo, isliye n ki copy pehle rakh lo."]},{"id":"anagram","title":"Anagram check","diff":3,"en":"Read two words (lowercase letters, at most 100 each). Print Yes if one is an anagram of the other (the same letters in any order), otherwise No.","hi":"Do words padho (lowercase letters, har ek 100 tak). Agar ek doosre ka anagram ho (same letters, koi bhi order) to Yes, warna No.","starter":"#include <stdio.h>\n#include <string.h>\n\nint main(void) {\n    char s[101];\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"listen silent\n","expected":"Yes\n","hidden":false},{"name":"Example 2","input":"hello world\n","expected":"No\n","hidden":false},{"name":"Hidden test 3","input":"a a\n","expected":"Yes\n","hidden":true},{"name":"Hidden test 4","input":"abc abcd\n","expected":"No\n","hidden":true},{"name":"Hidden test 5","input":"aabb abab\n","expected":"Yes\n","hidden":true},{"name":"Hidden test 6","input":"aab abb\n","expected":"No\n","hidden":true}],"topic":"strings","hints":["Two words are anagrams if each letter appears equally often in both.","Make int cnt[26] = {0}; add 1 for each letter of the first word, subtract 1 for the second.","Index with c - 'a'. If every count is 0 at the end, print Yes. Different lengths are never anagrams."],"hintsHi":["Do words anagram hain agar har letter dono mein barabar baar aaye.","int cnt[26] = {0}; pehle word ke har letter par +1, doosre par -1.","Index c - 'a' se karo. Aakhir mein sab count 0 hon to Yes print karo. Alag length wale kabhi anagram nahi."]},{"id":"caesar","title":"Caesar cipher","diff":3,"en":"First line: a shift k (0 to 25). Second line: a text of up to 200 characters (spaces allowed). Shift every letter forward by k places, wrapping from z to a. Keep upper and lower case, and leave all other characters unchanged.","hi":"Pehli line: shift k (0 se 25). Doosri line: text (200 characters tak, spaces ho sakte hain). Har letter ko k jagah aage badhao, z ke baad a se shuru. Chhote-bade letters waise hi rakho, baaki characters na badlo.","starter":"#include <stdio.h>\n\nint main(void) {\n    int k;\n    char line[256];\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"3\nHello, World!\n","expected":"Khoor, Zruog!\n","hidden":false},{"name":"Example 2","input":"13\nabc xyz\n","expected":"nop klm\n","hidden":false},{"name":"Hidden test 3","input":"0\nSame text 123\n","expected":"Same text 123\n","hidden":true},{"name":"Hidden test 4","input":"25\nZz Aa\n","expected":"Yy Zz\n","hidden":true},{"name":"Hidden test 5","input":"1\nthe quick brown fox jumps over the lazy dog.\n","expected":"uif rvjdl cspxo gpy kvnqt pwfs uif mbaz eph.\n","hidden":true}],"topic":"strings","hints":["Only letters move; spaces and others stay.","For lowercase: c = 'a' + (c - 'a' + k) % 26. Do the same idea with 'A' for uppercase.","The first line is a number, so after scanf(\"%d\") eat the newline before fgets, e.g. with getchar()."],"hintsHi":["Sirf letters khisakte hain; space aur baaki wahi rehte hain.","Lowercase ke liye: c = 'a' + (c - 'a' + k) % 26. Uppercase ke liye 'A' ke saath wahi idea.","Pehli line number hai, isliye scanf(\"%d\") ke baad fgets se pehle newline getchar() se kha lo."]},{"id":"second","title":"Second largest","diff":3,"en":"First read n (n >= 1), then n integers. Print the second largest distinct value, or None if all values are equal.","hi":"Pehle n padho (n >= 1), phir n integers. Doosra sabse bada alag (distinct) value print karo, ya sab barabar hon to None.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"5\n3 9 2 7 1\n","expected":"7\n","hidden":false},{"name":"Example 2","input":"4\n5 5 5 5\n","expected":"None\n","hidden":false},{"name":"Hidden test 3","input":"3\n9 9 8\n","expected":"8\n","hidden":true},{"name":"Hidden test 4","input":"2\n-1 -2\n","expected":"-2\n","hidden":true},{"name":"Hidden test 5","input":"1\n7\n","expected":"None\n","hidden":true},{"name":"Hidden test 6","input":"6\n1 2 3 4 5 2147483648\n","expected":"5\n","hidden":true}],"topic":"arrays","hints":["Track the biggest and the runner-up while reading.","Keep first and second. A new x bigger than first pushes first down to second.","Only count distinct values: if x equals first, ignore it. If second never changed, print None."],"hintsHi":["Padhte waqt sabse bada aur uske baad wala track karo.","first aur second rakho. Naya x first se bada ho to first ko second banao.","Sirf distinct values: x first ke barabar ho to ignore karo. Second kabhi na badla ho to None print karo."]},{"id":"wordcount","title":"Count the words","diff":3,"en":"Read one line (up to 300 characters). Print how many words it has. Words are separated by one or more spaces, and the line may start or end with spaces.","hi":"Ek line padho (300 characters tak). Usme kitne words hain print karo. Words ek ya zyada spaces se alag hote hain, line spaces se shuru ya khatam ho sakti hai.","starter":"#include <stdio.h>\n\nint main(void) {\n    char line[301];\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"hello world\n","expected":"2\n","hidden":false},{"name":"Example 2","input":"  lots   of   space  \n","expected":"3\n","hidden":false},{"name":"Hidden test 3","input":"single\n","expected":"1\n","hidden":true},{"name":"Hidden test 4","input":"\n","expected":"0\n","hidden":true},{"name":"Hidden test 5","input":"a b c d e f g h i j\n","expected":"10\n","hidden":true},{"name":"Hidden test 6","input":"   \n","expected":"0\n","hidden":true}],"topic":"strings","hints":["A word starts where a non-space follows a space (or the start).","Keep a flag inWord. When you see a non-space and inWord is 0, count++ and set inWord = 1.","Set inWord back to 0 on every space. Read the line with fgets."],"hintsHi":["Word wahan shuru hota hai jahan space ke baad non-space aata hai (ya shuruat).","inWord flag rakho. Non-space dikhe aur inWord 0 ho to count++ aur inWord = 1.","Har space par inWord wapas 0 karo. Line fgets se padho."]},{"id":"sortnums","title":"Sort the numbers","diff":3,"en":"First read n (1 <= n <= 1000), then n integers. Print them in ascending order, separated by single spaces.","hi":"Pehle n padho (1 <= n <= 1000), phir n integers. Unko chhote se bade order mein print karo, beech mein ek space.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"5\n3 1 4 1 5\n","expected":"1 1 3 4 5\n","hidden":false},{"name":"Example 2","input":"1\n9\n","expected":"9\n","hidden":false},{"name":"Hidden test 3" arrays","hints":["Store all numbers, then order them.","Bubble sort: two nested loops, swap a[j] and a[j+1] if they are in the wrong order.","n is at most 1000, so a simple n*n sort is fast enough. Print with single spaces."],"hintsHi":["Saare numbers store karo, phir order karo.","Bubble sort: do nested loops, galat order ho to a[j] aur a[j+1] swap karo.","n sirf 1000 tak hai, isliye simple n*n sort kaafi fast hai. Single space ke saath print karo."]},{"id":"pascal","title":"Pascal's triangle","diff":3,"en":"Read n (1 <= n <= 12). Print the first n rows of Pascal's triangle. Numbers in a row are separated by single spaces, with no leading or trailing spaces.","hi":"n padho (1 <= n <= 12). Pascal triangle ki pehli n rows print karo. Ek row ke numbers ke beech ek space, aage-peeche space nahi.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"1\n","expected":"1\n","hidden":false},{"name":"Example 2","input":"5\n","expected":"1\n1 1\n1 2 1\n1 3 3 1\n1 4 6 4 1\n","hidden":false},{"name":"Hidden test 3","input":"6\n","expected":"1\n1 1\n1 2 1\n1 3 3 1\n1 4 6 4 1\n1 5 10 10 5 1\n","hidden":true},{"name":"Hidden test 4","input":"12\n","expected":"1\n1 1\n1 2 1\n1 3 3 1\n1 4 6 4 1\n1 5 10 10 5 1\n1 6 15 20 15 6 1\n1 7 21 35 35 21 7 1\n1 8 28 56 70 56 28 8 1\n1 9 36 84 126 126 84 36 9 1\n1 10 45 120 210 252 210 120 45 10 1\n1 11 55 165 330 462 462 330 165 55 11 1\n","hidden":true}],"topic":"arrays","hints":["Every number is the sum of the two above it.","Keep a 2D array t[i][j]: t[i][0] = t[i][i] = 1, otherwise t[i-1][j-1] + t[i-1][j].","Print each row with spaces between numbers but no trailing space."],"hintsHi":["Har number apne upar ke do numbers ka jod hai.","2D array t[i][j] rakho: t[i][0] = t[i][i] = 1, warna t[i-1][j-1] + t[i-1][j].","Har row mein numbers ke beech space, par aakhir mein space nahi."]},{"id":"transpose","title":"Matrix transpose","diff":3,"en":"First read r and c (1 <= r, c <= 10), then an r "input":"837799\n","expected":"524\n","hidden":true},{"name":"Hidden test 6","input":"670617279\n","expected":"986\n","hidden":true},{"name":"Hidden test 7","input":"989345275\n","expected":"193\n","hidden":true}],"topic":"loops","hints":["Follow the rule step by step and count the steps.","while (n != 1) { n = n % 2 ? 3 * n + 1 : n / 2; steps++; }","Use long long because values grow above 2^31 on the way."],"hintsHi":["Rule ko step by step follow karo aur steps gino.","while (n != 1) { n = n % 2 ? 3 * n + 1 : n / 2; steps++; }","Beech mein values 2^31 se bade ho jaate hain, isliye long long lo."]},{"id":"lcs","title":"Longest common subsequence","diff":4,"en":"Read two words (lowercase letters, at most 100 each). Print the length of their longest common subsequence: the longest list of letters that appears in both words in the same order, not necessarily next to each other.","hi":"Do words padho (lowercase letters, har ek 100 tak). Unki longest common subsequence ki length print karo: wo sabse lambi letters ki list jo dono words mein same order mein aati ho (side-by-side zaroori nahi).","starter":"#include <stdio.h>\n#include <string.h>\n\nint main(void) {\n    char s[101];\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"abcde ace\n","expected":"3\n","hidden":false},{"name":"Example 2","input":"abc def\n","expected":"0\n","hidden":false},{"name":"Hidden test 3","input":"aggtab gxtxayb\n","expected":"4\n","hidden":true},{"name":"Hidden test 4","input":"a a\n","expected":"1\n","hidden":true},{"name":"Hidden test 5","input":"abcdefghij jihgfedcba\n","expected":"1\n","hidden":true},{"name":"Hidden test 6","input":"cdabddacbaaadcbcdabdcadcadcbabbcacccbbacbcadbdadddbbcdcaacbbcdccaabdadcacbbadcaabbcabbcabbbddabcbaac ddbccdbcabbddbdacacadddcbbcabaaddacbccbbcadcaabadabbdbadbcbdaacbdabcdccdddbbaaddabdbbbcdbadccababbad\n","expected":"64\n","hidden":true}],"topic":"recur","hints":["Compare the words one letter pair at a time.","Table L[i][j] = best length using the first i letters of a and the first j of b.","If a[i-1] == b[j-1] then L[i][j] = L[i-1][j-1] + 1, else the max of L[i-1][j] and L[i][j-1]. The answer is L[n][m]."],"hintsHi":["Words ko ek ek letter pair karke compare karo.","Table L[i][j] = a ke pehle i aur b ke pehle j letters ka best length.","a[i-1] == b[j-1] ho to L[i][j] = L[i-1][j-1] + 1, warna L[i-1][j] aur L[i][j-1] ka max. Answer L[n][m]."]},{"id":"primecount","title":"Count the primes","diff":4,"en":"Read n (1 <= n <= 5000000). Print how many prime numbers are less than or equal to n. Testing every number one by one will be too slow for the biggest n.","hi":"n padho (1 <= n <= 5000000). n ya usse chhote kitne prime numbers hain print karo. Sabse bade n par har number ko alag-alag check karna bahut slow hoga.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"10\n","expected":"4\n","hidden":false},{"name":"Example 2","input":"1\n","expected":"0\n","hidden":false},{"name":"Hidden test 3","input":"2\n","expected":"1\n","hidden":true},{"name":"Hidden test 4","input":"100\n","expected":"25\n","hidden":true},{"name":"Hidden test 5","input":"1000000\n","expected":"78498\n","hidden":true},{"name":"Hidden test 6","input":"5000000\n","expected":"348513\n","hidden":true}],"topic":"algo","hints":["Testing every number one by one is too slow for 5 million.","Sieve of Eratosthenes: mark multiples of each prime as not prime.","char comp[5000001]; for i from 2 while i * i <= n, if not marked, mark i*i, i*i+i, ... Then count unmarked numbers from 2."],"hintsHi":["5 million tak har number alag test karna bahut slow hai.","Sieve of Eratosthenes: har prime ke multiples ko not prime mark karo.","char comp[5000001]; i = 2 se i * i <= n tak, mark na ho to i*i, i*i+i, ... mark karo. Phir 2 se unmarked gino."]},{"id":"coins","title":"Fewest coins","diff":4,"en":"Read k (1 <= k <= 10), then k coin values (positive integers), then an amount (0 <= amount <= 10000). Print the fewest coins that add up to the amount, or -1 if it is impossible. Each coin value can be used any number of times. Picking the biggest coin first does not always work.","hi":"k padho (1 <= k <= 10), phir k coin values (positive integers), phir amount (0 <= amount <= 10000). Amount banane ke liye sabse kam coins print karo, ya mumkin na ho to -1. Har coin kitni bhi baar use ho sakta hai. Hamesha sabse bada coin pehle lena kaam nahi karta.","starter":"#include <stdio.h>\n\nint main(void) {\n    return 0;\n}\n","tests":[{"name":"Example 1","input":"3\n1 5 10\n28\n","expected":"6\n","hidden":false},{"name":"Example 2","input":"2\n2 4\n7\n","expected":"-1\n","hidden":false},{"name":"Hidden test 3","input":"3\n1 3 4\n6\n","expected":"2\n","hidden":true},{"name":"Hidden test 4","input":"1\n5\n0\n","expected":"0\n","hidden":true},{"name":"Hidden test 5","input":"4\n186 419 83 408\n6249\n","expected":"20\n","hidden":true},{"name":"Hidden test 6","input":"4\n1 5 10 25\n10000\n","expected":"400\n","hidden":true}],"topic":"recur","hints":["Greedy can fail here; build the answer from smaller amounts.","best[0] = 0 and best[x] = 1 + min(best[x - c]) over coins c <= x.","Start best[] at a big number. If best[amount] is still big, print -1."],"hintsHi":["Yahan greedy fail ho sakta hai; chhote amounts se answer banao.","best[0] = 0 aur best[x] = 1 + min(best[x - c]) un coins c ke liye jahan c <= x.","best[] ko bade number se shuru karo. best[amount] abhi bhi bada ho to -1 print karo."]},{"id":"brackets","title":"Balanced brackets","diff":4,"en":"Read one line made only of the characters ( ) [ ] { } (up to 1000 of them, possibly none). Print Yes if every bracket is closed by the matching kind in the correct order, otherwise No. An empty line is balanced.","hi":"Ek line padho jisme sirf ( ) [ ] { } characters hain (1000 tak, ya koi bhi nahi). Agar har bracket sahi jode aur sahi order mein band hota ho to Yes, warna No. Khaali line balanced maani jaati hai.","starter":"#include <stdio.
